# ===========================================================================
# NOVA Runtime — Tauri v2 packaging (Phase 5)
#
# Tauri v2 packaging for the NOVA desktop shell. The cached dependency set
# builds and tests offline on macOS; public distribution still requires
# release signing, notarization, and a bundled Node runtime.
# ===========================================================================
[package]
name = "nova-runtime"
version = "0.1.0"
description = "Desktop shell for NOVA Runtime — a real local Ollama-backed console, wrapped in a native window."
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "nova-runtime"
path = "src/main.rs"
