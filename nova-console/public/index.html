<title>NOVA Console</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.462.0/dist/umd/lucide.min.js"></script>
<style>
  /* ============ Tokens ============
     Deliberately single-theme: this is an operator console for a local
     inference runtime, in the tradition of a terminal or hardware-monitor
     UI -- those stay dark regardless of OS theme because the content
     (telemetry, logs, token math) is legible against near-black at any
     hour, and a console that flips pale in daylight reads as a toy, not
     an instrument. Colors are still painted explicitly, never inherited. */
  :root{
    --bg:#0a0c10; --bg-wash:#0d1015;
    --panel:#121620; --panel2:#161b26; --panel3:#1b2130;
    --line:#262d3a; --line-soft:#1c222c;
    --ink:#eef1f5; --ink-dim:#c7ced8;
    --muted:#8b96a6; --muted-dim:#5c6776;
    --amber:#f3a73e; --amber-ink:#1a1206; --amber-soft:#f3a73e1f; --amber-line:#f3a73e55;
    --green:#5fd39a; --green-soft:#5fd39a1a;
    --blue:#5fa8e0; --blue-soft:#5fa8e01a;
    --violet:#b28cf0; --violet-soft:#b28cf01a;
    --red:#e2645c; --red-soft:#e2645c1a;
    --cyan:#52c7d1; --cyan-soft:#52c7d11a;
    --rose:#e08fb0; --rose-soft:#e08fb01a;
    --font-ui:"Work Sans",-apple-system,Segoe UI,sans-serif;
    --font-mono:"Space Mono","SF Mono",monospace;
  }
  :root[data-theme="dawn"]{
    --bg:#f5f7fa; --bg-wash:#eef2f6;
    --panel:#ffffff; --panel2:#f2f5f8; --panel3:#e8edf3;
    --line:#cbd5e1; --line-soft:#e1e7ee;
    --ink:#172033; --ink-dim:#334155;
    --muted:#64748b; --muted-dim:#7a8798;
    --amber:#d97706; --amber-ink:#fffaf0; --amber-soft:#d9770618; --amber-line:#d9770655;
    --green:#16845b; --green-soft:#16845b18;
    --blue:#2879b8; --blue-soft:#2879b818;
    --violet:#7657b9; --violet-soft:#7657b918;
    --red:#c34545; --red-soft:#c3454518;
  }
  :root[data-theme="contrast"]{
    --bg:#000; --bg-wash:#000; --panel:#080808; --panel2:#101010; --panel3:#181818;
    --line:#707070; --line-soft:#3d3d3d; --ink:#fff; --ink-dim:#fff;
    --muted:#e4e4e4; --muted-dim:#b9b9b9; --amber:#ffbd32; --amber-ink:#000;
    --green:#5dffad; --green-soft:#5dffad22; --blue:#72c8ff; --blue-soft:#72c8ff22;
  }
  :root[data-theme="dawn"] body::before{opacity:.12;background-image:linear-gradient(#17203312 1px,transparent 1px),linear-gradient(90deg,#17203312 1px,transparent 1px);}
  :root[data-theme="dawn"] .rail{background:rgba(247,249,252,.94);}
  :root[data-theme="dawn"] .topbar{background:#ffffffdc;}
  :root[data-theme="dawn"] .statusbar{background:#fff;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:var(--font-ui); color:var(--ink); background:var(--bg);
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.28; z-index:0;
    background-image:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);
    background-size:26px 26px; mask-image:linear-gradient(to bottom,black,transparent 88%);
  }
  .mono{font-family:var(--font-mono);}
  .tnum{font-variant-numeric:tabular-nums;}
  ::selection{background:var(--amber-soft);}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#2a3240;border-radius:99px;}
  ::-webkit-scrollbar-track{background:transparent;}
  a{color:inherit;}
  button{font:inherit;color:inherit;cursor:pointer;}
  button:disabled{opacity:.45;cursor:not-allowed;}
  input,select,textarea{font:inherit;color:inherit;}

  /* ============ Shell ============ */
  .shell{position:relative;z-index:1;height:100vh;display:grid;grid-template-columns:226px minmax(0,1fr);}
  .shell.rail-collapsed{grid-template-columns:64px minmax(0,1fr);}
  .shell.rail-collapsed .rail-text{display:none;}

  .rail{background:rgba(13,16,21,.92);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:14px;min-height:0;overflow-y:auto;}
  .brand{display:flex;align-items:center;gap:9px;padding:4px 6px 2px;}
  .brand-mark{width:28px;height:28px;flex:none;border:1px solid var(--amber-line);border-radius:8px;display:grid;place-items:center;color:var(--amber);box-shadow:0 0 18px var(--amber-soft) inset, 0 0 14px var(--amber-soft);}
  .brand-name{font-size:13.5px;font-weight:700;letter-spacing:.06em;}
  .brand-sub{font-size:9.5px;color:var(--muted-dim);letter-spacing:.1em;text-transform:uppercase;margin-top:1px;}

  .rail-btn{display:flex;align-items:center;gap:8px;width:100%;border-radius:7px;padding:7px 8px;background:transparent;border:none;text-align:left;}
  .new-session-btn{background:var(--amber);color:var(--amber-ink);font-weight:700;font-size:13px;padding:9px 10px;border:none;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:7px;}
  .new-session-btn:hover{filter:brightness(1.08);}
  .rail-search{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:7px;padding:7px 9px;color:var(--muted);}
  .rail-search input{background:transparent;border:none;outline:none;width:100%;font-size:12.5px;color:var(--ink);}

  .nav-group{display:flex;flex-direction:column;gap:1px;}
  .nav-label{font:10px var(--font-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted-dim);padding:8px 8px 3px;}
  .nav-item{display:flex;align-items:center;gap:10px;width:100%;border:none;background:transparent;color:var(--muted);padding:7px 8px;border-radius:7px;font-size:13px;position:relative;}
  .nav-item svg{flex:none;opacity:.85;}
  .nav-item:hover{color:var(--ink);background:#ffffff08;}
  .nav-item.active{color:var(--ink);background:#ffffff0c;}
  .nav-item.active::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:2px;background:var(--amber);border-radius:2px;}
  .nav-item .dot{margin-left:auto;width:6px;height:6px;border-radius:99px;}

  .rail-foot{margin-top:auto;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:11px;}

  .app{min-width:0;display:grid;grid-template-rows:54px minmax(0,1fr) 27px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:#0b0e13d9;backdrop-filter:blur(6px);z-index:5;}
  .icon-btn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#ffffff05;border-radius:7px;color:var(--muted);}
  .icon-btn:hover{color:var(--ink);border-color:#3a4452;}
  .pill{display:inline-flex;align-items:center;gap:6px;font:11px var(--font-mono);letter-spacing:.03em;padding:5px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);}
  .pill .dot{width:6px;height:6px;border-radius:99px;flex:none;}
  .pill-state{font-weight:700;}
  .state-idle{color:var(--muted);}.state-idle .dot{background:var(--muted-dim);}
  .state-busy{color:var(--amber);border-color:var(--amber-line);background:var(--amber-soft);}.state-busy .dot{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft);}
  .state-good{color:var(--green);border-color:#5fd39a55;background:var(--green-soft);}.state-good .dot{background:var(--green);box-shadow:0 0 0 3px var(--green-soft);}
  .state-bad{color:var(--red);border-color:#e2645c55;background:var(--red-soft);}.state-bad .dot{background:var(--red);box-shadow:0 0 0 3px var(--red-soft);}
  .state-info{color:var(--blue);border-color:#5fa8e055;background:var(--blue-soft);}.state-info .dot{background:var(--blue);box-shadow:0 0 0 3px var(--blue-soft);}
  .cmdk-btn{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:#ffffff05;border-radius:7px;padding:6px 8px 6px 11px;color:var(--muted);font-size:12.5px;min-width:180px;}
  .cmdk-btn kbd{font:10px var(--font-mono);border:1px solid var(--line);border-radius:4px;padding:2px 5px;color:var(--muted-dim);margin-left:auto;}
  .topbar-right{display:flex;align-items:center;gap:8px;}
  .top-sep{width:1px;height:20px;background:var(--line);}

  main{min-height:0;overflow:hidden;position:relative;}
  .view{display:none;height:100%;overflow-y:auto;}
  .view.active{display:block;}
  .view-pad{padding:24px clamp(16px,3vw,40px) 40px;}
  .view-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
  .eyebrow{font:10.5px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted-dim);}
  .view-title{font-size:22px;font-weight:700;margin:4px 0 0;letter-spacing:-.01em;text-wrap:balance;}
  .view-desc{color:var(--muted);font-size:13px;margin-top:4px;max-width:58ch;}

  .statusbar{display:flex;align-items:center;gap:16px;border-top:1px solid var(--line);background:#0b0e13;padding:0 16px;font:10.5px var(--font-mono);color:var(--muted-dim);overflow-x:auto;white-space:nowrap;}
  .statusbar .seg{display:flex;align-items:center;gap:6px;flex:none;}
  .statusbar .seg b{color:var(--ink-dim);font-weight:400;}
  .statusbar .sep{opacity:.5;}
  .statusbar .flexfill{flex:1;}
  .statusbar .privacy{margin-left:auto;}

  /* ============ Buttons ============ */
  .btn{display:inline-flex;align-items:center;gap:7px;border-radius:7px;padding:8px 13px;font-size:13px;font-weight:600;border:1px solid transparent;}
  .btn-amber{background:var(--amber);color:var(--amber-ink);}
  .btn-amber:hover{filter:brightness(1.08);}
  .btn-line{border-color:var(--line);background:#ffffff05;color:var(--ink-dim);}
  .btn-line:hover{border-color:#3a4452;color:var(--ink);}
  .btn-ghost{background:transparent;color:var(--muted);border-color:transparent;}
  .btn-ghost:hover{color:var(--ink);}
  .btn-sm{padding:5px 9px;font-size:11.5px;border-radius:6px;}
  .btn-danger{border-color:#e2645c55;color:var(--red);background:var(--red-soft);}

  /* ============ Cards / panels ============ */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:11px;}
  .card-grid{display:grid;gap:14px;}
  .cols-2{grid-template-columns:repeat(2,minmax(0,1fr));}
  .cols-3{grid-template-columns:repeat(3,minmax(0,1fr));}
  @media(max-width:980px){.cols-2,.cols-3{grid-template-columns:1fr;}}

  .badge{display:inline-flex;align-items:center;gap:5px;font:10px var(--font-mono);letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted);}
  .badge-green{color:var(--green);border-color:#5fd39a4a;background:var(--green-soft);}
  .badge-amber{color:var(--amber);border-color:var(--amber-line);background:var(--amber-soft);}
  .badge-blue{color:var(--blue);border-color:#5fa8e04a;background:var(--blue-soft);}
  .badge-red{color:var(--red);border-color:#e2645c4a;background:var(--red-soft);}
  .badge-violet{color:var(--violet);border-color:#b28cf04a;background:var(--violet-soft);}
  .badge-cyan{color:var(--cyan);border-color:#52c7d14a;background:var(--cyan-soft);}
  .badge-rose{color:var(--rose);border-color:#e08fb04a;background:var(--rose-soft);}
  .switch{position:relative;display:inline-block;width:32px;height:18px;flex:none;cursor:pointer;}
  .switch input{opacity:0;width:0;height:0;position:absolute;}
  .switch .track{position:absolute;inset:0;background:var(--panel3);border:1px solid var(--line);border-radius:99px;transition:background .15s,border-color .15s;}
  .switch .knob{position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:99px;background:var(--muted-dim);transition:transform .15s,background .15s;}
  .switch input:checked + .track{background:var(--green-soft);border-color:#5fd39a55;}
  .switch input:checked + .track .knob{transform:translateX(14px);background:var(--green);}

  .kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:12.5px;}
  .kv span:nth-child(odd){color:var(--muted);}
  .kv span:nth-child(even){font-family:var(--font-mono);text-align:right;color:var(--ink-dim);}

  .bar{height:6px;border-radius:99px;background:#ffffff0c;overflow:hidden;}
  .bar>span{display:block;height:100%;border-radius:99px;background:var(--amber);transition:width .35s ease;}
  .bar.green>span{background:var(--green);}
  .bar.blue>span{background:var(--blue);}
  .bar.red>span{background:var(--red);}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap;}
  .tab{border:none;background:transparent;color:var(--muted);padding:9px 3px;font-size:12.5px;font-weight:600;position:relative;margin-right:14px;}
  .tab:hover{color:var(--ink-dim);}
  .tab.active{color:var(--ink);}
  .tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--amber);border-radius:2px;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;font:10px var(--font-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted-dim);padding:8px 10px;border-bottom:1px solid var(--line);}
  td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .table-wrap{overflow-x:auto;}

  .empty-hint{color:var(--muted-dim);font-size:12.5px;padding:18px 4px;}
  .toggle{width:32px;height:18px;border-radius:20px;background:#343d47;padding:2px;flex:none;border:none;}
  .toggle::after{content:"";display:block;width:14px;height:14px;border-radius:50%;background:#c6cdd5;transition:.16s;}
  .toggle.on{background:#a3721f;}.toggle.on::after{transform:translateX(14px);background:#fff1d4;}

  .modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px;background:#00000099;}
  .modal.open{display:flex;}
  .modal-card{width:min(640px,100%);max-height:86vh;overflow-y:auto;background:var(--panel2);border:1px solid #384251;border-radius:13px;box-shadow:0 30px 80px #000a;}
  .modal-card.wide{width:min(880px,100%);}

  .toast{position:fixed;right:16px;bottom:16px;z-index:80;background:#1a1f28;border:1px solid #3c4654;border-radius:9px;padding:11px 14px;font-size:12.5px;transform:translateY(14px);opacity:0;transition:.2s;box-shadow:0 14px 34px #0008;}
  .toast.show{transform:none;opacity:1;}

  /* ============ Console-specific ============ */
  .console-grid{height:100%;display:grid;grid-template-columns:252px minmax(380px,1fr) 300px;}
  .sess-pane{border-right:1px solid var(--line);min-height:0;overflow-y:auto;padding:14px;}
  .sess-group-label{font:10px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted-dim);margin:14px 0 6px;padding:0 2px;}
  .sess-group-label:first-child{margin-top:0;}
  .sess-item{border:1px solid transparent;border-radius:8px;padding:8px 9px;margin-top:2px;cursor:pointer;}
  .sess-item:hover{background:#ffffff08;}
  .sess-item.selected{background:#ffffff0c;border-color:#ffffff14;}
  .sess-title-row{display:flex;align-items:center;gap:6px;}
  .sess-title{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
  .sess-meta{font:9.5px var(--font-mono);color:var(--muted-dim);margin-top:4px;display:flex;gap:8px;}
  .sess-tags{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap;}
  .tag-chip{font:9px var(--font-mono);padding:2px 6px;border-radius:4px;background:#ffffff0a;color:var(--muted);border:1px solid var(--line);}

  .convo-pane{min-width:0;min-height:0;display:flex;flex-direction:column;background:linear-gradient(170deg,#0c0f14,#0a0c10);}
  .convo-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);}
  .convo-title-wrap{min-width:0;}
  .convo-title{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .convo-sub{font:10.5px var(--font-mono);color:var(--muted-dim);margin-top:2px;}
  /* Allow the message region to shrink and scroll. Without min-height:0,
     its empty-state content can force the composer below the status bar. */
  .msg-list{flex:1;min-height:0;overflow-y:auto;padding:22px clamp(14px,3vw,48px) 10px;}
  .msg{max-width:760px;margin:0 auto 18px;}
  .msg-role{font:10px var(--font-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted-dim);margin-bottom:6px;display:flex;align-items:center;gap:8px;}
  .bubble{border:1px solid var(--line);background:#12171f;border-radius:11px;padding:13px 15px;line-height:1.62;font-size:13.5px;white-space:pre-wrap;}
  .msg.user .bubble{margin-left:14%;background:var(--amber-soft);border-color:var(--amber-line);}
  .msg.assistant .bubble{margin-right:4%;}
  .msg-cites{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .cite-chip{font:10px var(--font-mono);padding:3px 7px;border-radius:5px;background:#ffffff08;border:1px solid var(--line);color:var(--blue);}
  .msg-stats{display:flex;gap:12px;margin-top:7px;font:10px var(--font-mono);color:var(--muted-dim);}
  .runtime-inline{max-width:760px;margin:0 auto 14px;font:10.5px var(--font-mono);color:var(--muted-dim);border-left:2px solid var(--amber-line);padding:2px 0 2px 12px;display:flex;gap:10px;align-items:center;}
  .runtime-inline .bar{width:70px;}

  .composer-wrap{padding:10px clamp(14px,3vw,48px) 16px;background:linear-gradient(transparent,#0a0c10 40%);}
  .composer{max-width:760px;margin:0 auto;border:1px solid #343f4c;background:#10151c;border-radius:13px;padding:10px;box-shadow:0 14px 38px #0006;}
  .composer textarea{width:100%;resize:none;border:none;outline:none;background:transparent;color:var(--ink);min-height:44px;max-height:140px;padding:6px;font:13.5px var(--font-ui);}
  .composer-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:4px;}
  .composer-left,.composer-right{display:flex;align-items:center;gap:6px;}
  .chip-toggle{display:inline-flex;align-items:center;gap:6px;font:11px var(--font-mono);padding:6px 9px;border-radius:7px;border:1px solid var(--line);color:var(--muted);}
  .chip-toggle.on{color:var(--green);border-color:#5fd39a4a;background:var(--green-soft);}
  .send-btn{width:34px;height:34px;border-radius:9px;background:var(--amber);color:var(--amber-ink);display:inline-flex;align-items:center;justify-content:center;border:none;}
  .send-btn:hover{filter:brightness(1.08);}
  .send-btn.stop{background:var(--red);color:#fff;}
  .context-chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 2px 8px;}
  .ctx-chip{font:10.5px var(--font-mono);padding:4px 8px;border-radius:6px;background:#ffffff08;border:1px solid var(--line);color:var(--ink-dim);display:flex;align-items:center;gap:6px;}
  .ctx-chip button{color:var(--muted-dim);}

  .empty-console{max-width:620px;margin:9vh auto 0;text-align:center;padding:0 16px;}
  .quick-card{border:1px solid var(--line);background:#11161e;border-radius:10px;padding:13px;text-align:left;}
  .quick-card:hover{border-color:var(--amber-line);background:var(--amber-soft);}

  .inspector-pane{border-left:1px solid var(--line);min-height:0;overflow-y:auto;padding:14px;}
  .insp-tabs{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:12px;}
  .insp-tab{font:10px var(--font-mono);letter-spacing:.04em;padding:5px 8px;border-radius:6px;color:var(--muted);border:1px solid transparent;}
  .insp-tab:hover{color:var(--ink-dim);}
  .insp-tab.active{color:var(--amber);background:var(--amber-soft);border-color:var(--amber-line);}
  .insp-section{margin-bottom:14px;}
  .insp-section h3{font:10px var(--font-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted-dim);margin:0 0 9px;}
  .budget-stack{display:flex;height:9px;border-radius:99px;overflow:hidden;background:#ffffff0c;}
  .budget-row{display:flex;justify-content:space-between;font-size:11.5px;padding:5px 0;border-bottom:1px solid var(--line-soft);}
  .budget-row:last-child{border-bottom:none;}
  .swatch{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px;}
  .retr-item{border:1px solid var(--line);border-radius:8px;padding:8px 9px;margin-bottom:7px;}
  .retr-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px;cursor:pointer;}

/* ===================== marker: DATA LAYER ===================== */
/* ===================== DATA LAYER (NOVA Runtime API, cache-hydrated) =====================
   Phase 1 replaced IndexedDB with a real local backend ("NOVA Runtime", see
   /server.js) that persists every store to real SQLite. The seam the
   roadmap was built around: every render function in this file still reads
   DB.<name> synchronously and calls idbPut/idbAll/idbDelete/idbClearAll
   exactly as before — only what's *behind* those four functions changed,
   from indexedDB.open() to fetch() against this same origin's /api/store/*.
   idbPut/idbDelete stay synchronous from the caller's point of view (update
   the in-memory cache immediately, fire the network write in the
   background) because dozens of call sites across 17 views rely on that —
   rewriting them to await a promise was explicitly out of scope for making
   the seam swap invisible. */
const STORE_NAMES = ['sessions','models','modelProfiles','knowledgeCollections','knowledgeDocuments','knowledgeChunks','automations','automationRuns','evaluations','preferences','runtimeEvents','collectionRuns',
  'skills','mcpServers','agents','workflows','workflowRuns','executions','workspaceRoots','workspaceReports','workspacePlans','workspaceChanges','workspaceRuns','workspaceGitDrafts'];
const DB = {}; STORE_NAMES.forEach(n => DB[n] = []);
let backendHealthy = true;
function apiUrl(p){ return p; } // same-origin — NOVA Runtime serves this file and the API from one port
function idbAll(store){
  return fetch(apiUrl('/api/store/'+encodeURIComponent(store)))
    .then(r => { if (!r.ok) throw new Error('store fetch failed: '+r.status); backendHealthy = true; return r.json(); })
    .catch(err => { backendHealthy = false; console.error('[nova-runtime] idbAll('+store+') failed', err); return DB[store] || []; });
}
function idbPut(store, value){
  DB[store] = DB[store] || [];
  const i = DB[store].findIndex(r => r.id === value.id);
  if (i >= 0) DB[store][i] = value; else DB[store].push(value);
  fetch(apiUrl('/api/store/'+encodeURIComponent(store)), {
    method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(value),
  }).then(r => { backendHealthy = r.ok; }).catch(() => { backendHealthy = false; });
  return value;
}
function idbDelete(store, id){
  DB[store] = (DB[store]||[]).filter(r => r.id !== id);
  fetch(apiUrl('/api/store/'+encodeURIComponent(store)+'/'+encodeURIComponent(id)), {method:'DELETE'})
    .then(r => { backendHealthy = r.ok; }).catch(() => { backendHealthy = false; });
}
async function idbClearAll(){
  try {
    const r = await fetch(apiUrl('/api/store/_clear-all'), {method:'POST'});
    backendHealthy = r.ok;
  } catch(e) { backendHealthy = false; }
}
async function idbClearStore(store){
  DB[store] = [];
  try {
    const rows = await idbAll(store);
    await Promise.all((rows||[]).map(r => idbDelete(store, r.id)));
  } catch(e) {}
}
/* runtimeEvents and executions are excluded from the eager, load-everything
   hydrate below (Phase 5) — those two stores are the ones an actual
   long-lived workspace grows without bound, and fetching the whole table
   on every page load doesn't scale, it just used to be silently trimmed
   back down client-side afterward (the old TRACE_CAP=500 splice, which
   never touched what was actually stored). The Trace and Execution
   History views now page through the real backend instead — see
   loadTracePage()/loadHistoryPage() below — and DB.runtimeEvents /
   DB.executions stay as this-session-only live buffers, appended to by
   logEvent()/logExecution() as they always were. */
const EAGER_STORE_NAMES = STORE_NAMES.filter(n => n !== 'runtimeEvents' && n !== 'executions');
async function hydrate(){
  const results = await Promise.all(EAGER_STORE_NAMES.map(n => idbAll(n)));
  EAGER_STORE_NAMES.forEach((n,i) => { DB[n] = results[i] || []; });
}

/* ===================== RUNTIME TRACE (append-only, really unbounded) =====================
   Every event this session logs is written straight to SQLite via idbPut —
   nothing is ever deleted server-side. DB.runtimeEvents itself is just this
   session's own live buffer (for the Runtime inspector's "recent" strip and
   for the Trace view to merge in a just-logged event before the next
   backend page fetch catches up) — SESSION_BUFFER_SOFT_CAP below trims
   *that in-memory JS array* purely so one very long-running tab doesn't
   grow its own heap forever. It is NOT a retention policy: unlike the old
   TRACE_CAP, nothing this trims was ever the only copy — the Trace view
   reads the real, complete history straight from the backend via
   loadTracePage()/'/api/store/runtimeEvents/page', not from this array. */
const SESSION_BUFFER_SOFT_CAP = 3000;
function logEvent(category, message, extra){
  const ev = { id: uid('ev'), at: nowIso(), category, message, extra: extra||null };
  DB.runtimeEvents.push(ev);
  if (DB.runtimeEvents.length > SESSION_BUFFER_SOFT_CAP) DB.runtimeEvents.splice(0, DB.runtimeEvents.length - SESSION_BUFFER_SOFT_CAP);
  idbPut('runtimeEvents', ev);
  if (currentView === 'trace') renderTraceLog();
  if (currentView === 'runtime') renderRuntimeView();
  return ev;
}

/* ===================== UNIFIED EXECUTION HISTORY =====================
   Every cross-cutting action in the workspace — a generation, a skill run,
   an MCP call, an agent run, a workflow run, an approval decision, an
   export, or a caught error — writes exactly one row here via logExecution,
   in addition to whatever line it also writes to the raw trace above. This
   is what the Execution History view reads; it is never backfilled or
   synthesized separately from the actions that actually happened. */
const EXECUTION_TYPES = ['inference','skill','mcp','agent','workflow','approval','error','export'];
function logExecution(type, label, status, detail, relatedId){
  const ex = { id: uid('ex'), type, label, status, detail: detail||'', relatedId: relatedId||null,
    startedAt: nowIso(), finishedAt: (status==='running'||status==='pending') ? null : nowIso() };
  idbPut('executions', ex);
  if (currentView === 'history') renderHistoryRows();
  return ex;
}
function updateExecution(id, patch){
  const ex = DB.executions.find(x=>x.id===id); if (!ex) return null;
  Object.assign(ex, patch);
  if (!ex.finishedAt && ex.status!=='running' && ex.status!=='pending') ex.finishedAt = nowIso();
  idbPut('executions', ex);
  if (currentView === 'history') renderHistoryRows();
  return ex;
}

function modelById(id){ return DB.models.find(m => m.id === id); }
function sessionById(id){ return DB.sessions.find(s => s.id === id); }
function activeSession(){ return sessionById(activeSessionId); }
function loadedModel(){ return DB.models.find(m => m.loaded) || DB.models[0]; }
function visibleSessions(){ return DB.sessions.slice().sort((a,b)=> b.updatedAt.localeCompare(a.updatedAt)); }

/* Privacy is a computed runtime state, not an unconditional claim -- see
   Settings > Privacy. It reflects the network-access preference AND whether
   the currently loaded model actually runs locally. */
function computePrivacyState(){
  const lm = loadedModel();
  if (lm && lm.runtimeKind === 'remote') return {level:'REMOTE MODEL', cls:'state-bad', icon:'cloud'};
  if (getPrefs().webAccess) return {level:'NETWORK ALLOWED', cls:'state-info', icon:'wifi'};
  return {level:'LOCAL ONLY', cls:'state-good', icon:'shield-check'};
}

function setPipelineState(state, detail){
  PIPELINE.state = state; PIPELINE.detail = detail || '';
  const el = $('pipelineState'), ed = $('pipelineDetail');
  if (el) { el.textContent = state.replace('_',' / '); el.className = 'mono ' + (
    state==='ERROR' ? 'err' : ''); el.style.color = {
      IDLE:'var(--muted-dim)', QUEUED:'var(--blue)', PREPARING:'var(--amber)', RETRIEVING:'var(--amber)',
      PREFILL:'var(--amber)', GENERATING:'var(--amber)', TOOL_RUNTIME:'var(--amber)', COMPLETE:'var(--green)',
      CANCELLING:'var(--red)', CANCELLED:'var(--muted-dim)', ERROR:'var(--red)'
    }[state] || 'var(--muted-dim)'; }
  if (ed) ed.textContent = PIPELINE.detail;
  renderModelStatusPill();
}

function showView(name){
  currentView = name;
  $$('.view').forEach(v => v.classList.remove('active'));
  const target = $(name + 'View'); if (target) target.classList.add('active');
  $$('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === name));
  $('topbarViewLabel').textContent = (LANGUAGE_LABELS[getPrefs().language] || LANGUAGE_LABELS.en)[name] || VIEW_LABELS[name] || name;
  $('rail').classList.remove('open');
  const renderers = {
    sessions:renderSessionsView, workspace:renderWorkspaceView, models:renderModelsView, knowledge:renderKnowledgeView,
    retrieval:renderRetrievalView, automations:renderAutomationsView, evaluations:renderEvaluationsView,
    skills:renderSkillsView, mcp:renderMcpView, agents:renderAgentsView, workflows:renderWorkflowsView, collector:renderCollectorView, graph:renderGraphView, browser:renderBrowserView,
    runtime:renderRuntimeView, trace:renderTraceView, git:renderGitView, history:renderHistoryView, diagnostics:renderDiagnosticsView, settings:renderSettingsView,
  };
  if (renderers[name]) renderers[name]();
  if (name === 'console') renderConsole();
}

async function syncModelsFromOllamaIfAvailable(){
  await refreshOllamaStatus();
  if (!ollamaStatus.reachable) return;
  if (getPrefs().ollamaSynced) return; // one-time replace of the seeded demo models with real ones
  try {
    const r = await fetch(apiUrl('/api/models/sync'), {method:'POST'});
    if (!r.ok) return;
    DB.models = await idbAll('models');
    setPrefs({ollamaSynced:true});
    logEvent('MODEL', 'synced '+DB.models.length+' model(s) from Ollama at '+ollamaStatus.host);
  } catch(e) { /* stay on the seeded demo models this session */ }
}

async function init(){
  await hydrate();
  await seedIfEmpty();
  // runtimeEvents/executions are no longer part of hydrate()'s eager fetch
  // (see its comment) — seed the session's live buffers with just the
  // most recent real page so the Runtime inspector's "recent activity"
  // strip isn't empty on a fresh load, without pulling the whole table.
  try {
    const [evPage, exPage] = await Promise.all([
      fetch(apiUrl('/api/store/runtimeEvents/page?limit=50')).then(r=>r.ok?r.json():null).catch(()=>null),
      fetch(apiUrl('/api/store/executions/page?limit=50')).then(r=>r.ok?r.json():null).catch(()=>null),
    ]);
    if (evPage) DB.runtimeEvents = evPage.rows.slice().reverse();
    if (exPage) DB.executions = exPage.rows.slice().reverse();
  } catch(e) { /* backend unreachable this tick — buffers just start empty */ }
  await syncModelsFromOllamaIfAvailable();
  if (!activeSessionId && DB.sessions.length) activeSessionId = visibleSessions().filter(s=>!s.archived)[0]?.id || null;
  inspectorTab = getPrefs().inspectorTab || 'context';
  applyAppearance();
  renderShellChrome();
  renderConsole();
  startTelemetryLoop();
  runDiagnostics(true);
  refreshEventTotal();
  refreshSchedulerStatus();
  setInterval(refreshOllamaStatus, 5000);
  setInterval(refreshMcpApprovals, 3000);
  setInterval(refreshEventTotal, 15000);
  setInterval(refreshSchedulerStatus, 15000);
  setInterval(()=>{ if (gitAutoRefresh) refreshGitStatus(); }, 10000);
  refreshGitStatus();
  if (window.lucide) lucide.createIcons();
}

/* TELE now mirrors /api/telemetry (real os.cpus()/os.totalmem() deltas,
   real GPU probe where the platform exposes one — see lib/telemetry.js).
   Two fields stay honestly unavailable rather than faked: `thermal` (no
   portable Node API for this) and `kvCache` (Ollama's HTTP API doesn't
   expose per-request KV cache occupancy) — both render as "—" instead of
   a number. `tokps` during an actual generation is driven by
   liveDecodeTps, which runPipeline's real streaming loop updates from
   Ollama's own eval_count/eval_duration as tokens arrive. */
const TELE = {cpu:0, ram:0, ramTotal:0, gpu:null, gpuAvailable:false, vram:null, vramTotal:null, tokps:0, ttft:0, queue:0, thermal:null, kvCache:null, kvCacheMax:null, history:[], sampledAt:null};
let liveDecodeTps = 0;
async function stepTelemetry(){
  try {
    const r = await fetch(apiUrl('/api/telemetry'));
    if (r.ok) {
      const t = await r.json();
      if (t.cpu && t.cpu.percent != null) TELE.cpu = t.cpu.percent;
      if (t.ram) { TELE.ram = t.ram.usedGb; TELE.ramTotal = t.ram.totalGb; }
      TELE.gpuAvailable = !!(t.gpu && t.gpu.available);
      TELE.gpu = TELE.gpuAvailable ? t.gpu.utilPercent : null;
      TELE.vram = TELE.gpuAvailable ? t.gpu.vramUsedGb : null;
      TELE.vramTotal = TELE.gpuAvailable ? t.gpu.vramTotalGb : null;
      TELE.sampledAt = Date.now(); // real liveness signal — Diagnostics' "Telemetry loop" check reads this instead of a hardcoded ok:true
    }
  } catch(e) { /* backend unreachable this tick — keep last known values */ }
  const busy = PIPELINE.state === 'GENERATING';
  TELE.tokps = busy ? liveDecodeTps : Math.max(0, TELE.tokps*0.6);
  TELE.queue = runningAutomationIds.size + (PIPELINE.state==='QUEUED'?1:0);
  TELE.history.push(TELE.tokps);
  if (TELE.history.length > 60) TELE.history.shift();
  renderStatusBar();
  if (currentView === 'runtime') renderRuntimeView();
}

function computeContextBudget(s){
  const convo = s.messages.reduce((sum,m)=> sum + Math.round((m.content||'').length/4), 0);
  const system = 812, instructions = 418;
  const retrieved = s.preferences.retrieval ? 3781 : 0;
  const files = ((s._contextFiles||[]).length) * 463;
  const total = system + convo + retrieved + files + instructions;
  const model = modelById(s.modelId);
  const max = model ? model.ctx*1000 : 32000;
  return {system, conversation:convo, retrieved, files, instructions, total, max};
}

async function draftWorkspacePlanFromConversation(session,text){
  try{
    const response=await fetch(apiUrl('/api/workspace/plans/from-conversation'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({request:text,sessionId:session.id})});
    if(!response.ok)return false;
    const data=await response.json();if(!data.matched)return false;
    const plan=data.plan,index=DB.workspacePlans.findIndex(x=>x.id===plan.id);if(index>=0)DB.workspacePlans[index]=plan;else DB.workspacePlans.push(plan);
    const folder=plan.rootSelectionRequired?'Folder: selection required in Local Workspace.':'Folder: '+plan.folders.map(x=>x.path).join(', ')+'.';
    const content=(data.reused?'Reused an equivalent saved scan plan.':'Created a reviewable scan plan.')+' '+folder+' Tools: '+plan.tools.join(', ')+'. Expected output: '+plan.expectedOutput.join('; ')+'. Permissions: read-only access to the approved root; no local-folder writes, command execution, or network access.';
    session.messages.push({id:uid('msg'),role:'assistant',content,createdAt:nowIso(),workspacePlanId:plan.id});
    session.updatedAt=nowIso();idbPut('sessions',session);renderConvo();renderSessList();logEvent('WORKFLOW','workspace scan plan drafted · '+plan.id);setPipelineState('COMPLETE','scan plan ready for review');
    return true;
  }catch(_){return false;}
}

async function runPipeline(s, promptText){
  PIPELINE.cancelRequested=false; PIPELINE.pauseRequested=false; PIPELINE.paused=false; PIPELINE.sessionId=s.id;
  setSendButtonRunning(true);
  try{
    setPipelineState('PREPARING','assembling context');
    await sleep(110);
    const budget = computeContextBudget(s);
    logEvent('SESSION', budget.total.toLocaleString()+' tokens assembled');

    let chosen = [];
    if (s.preferences.retrieval){
      setPipelineState('RETRIEVING','searching collections');
      const excluded = new Set(s.excludedDocIds||[]);
      let retrievalWasReal = false;
      if (ollamaStatus.reachable && DB.knowledgeChunks.some(c=>c.embedded)){
        try {
          const r = await fetch(apiUrl('/api/knowledge/search'), {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ query: promptText, topK: 10, rerank: true }),
          });
          if (r.ok){
            const data = await r.json();
            if (data.usedRealEmbeddings){
              const filtered = data.results.filter(res => !excluded.has(res.docId)).slice(0, 4);
              chosen = filtered.map(res => ({ docId: res.docId, docName: res.docName, text: res.text, _score: res.vectorScore }));
              retrievalWasReal = true;
              logEvent('RAG', 'searched '+data.poolSize+' embedded chunks ('+data.embeddingModel+', hybrid rerank)');
              logEvent('RAG', chosen.length+' chunks selected — real vector similarity + BM25 (RRF), not simulated');
            }
          }
        } catch(e) { /* backend/Ollama hiccup mid-request — fall through to the simulated picker below */ }
      }
      if (!retrievalWasReal){
        await sleep(170);
        logEvent('RAG', 'searching '+DB.knowledgeCollections.length+' collections (simulated — no reachable embedded knowledge base)');
        await sleep(130);
        const pool = DB.knowledgeChunks.filter(c => c.embedded && !excluded.has(c.docId));
        chosen = pool.slice(0, Math.min(pool.length, 2+Math.floor(Math.random()*2)));
        logEvent('RAG', chosen.length+' chunks selected from '+pool.length+' candidates (simulated)');
      }
    }

    const model = modelById(s.modelId);
    if (!model || !model.loaded){
      setPipelineState('ERROR','no model loaded');
      logEvent('ERROR','generation requested with no loaded model');
      setSendButtonRunning(false);
      await sleep(1200); setPipelineState('IDLE','');
      return;
    }
    const useRealInference = model.runtime === 'ollama' && ollamaStatus.reachable;
    setPipelineState('PREFILL', useRealInference ? 'loading '+model.name : 'loading '+model.name+' (simulated)');
    logEvent('MODEL', model.name+' · prefill started');

    let outcome, assistantMsg;
    if (useRealInference){
      assistantMsg = {id:uid('msg'), role:'assistant', content:'', createdAt:nowIso(),
        citations:chosen.map(c=>({docId:c.docId, label:c.docName, score:c._score!=null?+c._score.toFixed(3):+rand(0.78,0.97).toFixed(2)})),
        stats:{ttft:0, tokPerSec:0, tokens:0, simulated:false}};
      s.messages.push(assistantMsg);
      const reqStart = performance.now();
      const controller = new AbortController();
      PIPELINE.abortController = controller;
      let pendingFlush = '';
      let firstChunkAt = null;
      outcome = 'done';
      try {
        const history = s.messages.slice(0, -1).map(m => ({role: m.role, content: m.content}));
        const resp = await fetch(apiUrl('/api/chat/stream'), {
          method:'POST', headers:{'Content-Type':'application/json'}, signal: controller.signal,
          body: JSON.stringify({
            model: model.id, messages: history,
            options: {
              temperature: s.preferences.temperature, top_p: s.preferences.topP, top_k: s.preferences.topK,
              repeat_penalty: s.preferences.repeatPenalty, num_predict: s.preferences.maxTokens,
              seed: s.preferences.seed ?? undefined,
            },
          }),
        });
        if (!resp.ok){ const e = await resp.json().catch(()=>({})); throw new Error(e.error || ('Ollama proxy HTTP '+resp.status)); }
        setPipelineState('GENERATING','streaming response');
        let buf = '';
        for await (const chunk of resp.body){
          buf += new TextDecoder().decode(chunk, {stream:true});
          let nl;
          while ((nl = buf.indexOf('\n')) >= 0){
            const line = buf.slice(0, nl); buf = buf.slice(nl+1);
            if (!line.trim()) continue;
            const evt = JSON.parse(line);
            const piece = (evt.message && evt.message.content) || '';
            if (piece){
              if (firstChunkAt === null){ firstChunkAt = performance.now(); assistantMsg.stats.ttft = Math.round(firstChunkAt - reqStart); }
              if (PIPELINE.paused) pendingFlush += piece;
              else { assistantMsg.content += pendingFlush + piece; pendingFlush = ''; renderConvo(); }
            }
            if (evt.done){
              assistantMsg.content += pendingFlush; pendingFlush = '';
              const genTps = (evt.eval_count && evt.eval_duration) ? +(evt.eval_count/(evt.eval_duration/1e9)).toFixed(1) : null;
              const promptTps = (evt.prompt_eval_count && evt.prompt_eval_duration) ? +(evt.prompt_eval_count/(evt.prompt_eval_duration/1e9)).toFixed(1) : null;
              assistantMsg.stats.tokens = evt.eval_count || Math.round(assistantMsg.content.length/4.2);
              assistantMsg.stats.tokPerSec = genTps ?? assistantMsg.stats.tokPerSec;
              liveDecodeTps = 0;
              if (genTps != null){ model.genTps = genTps; }
              if (promptTps != null){ model.promptTps = promptTps; }
              model.ttft = assistantMsg.stats.ttft; model.loaded = true;
              idbPut('models', model);
            } else if (firstChunkAt !== null && !PIPELINE.paused){
              liveDecodeTps = assistantMsg.stats.tokPerSec || model.genTps || liveDecodeTps;
            }
            renderConvo();
            $('tokenCounter').textContent = (assistantMsg.stats.tokens || Math.round(assistantMsg.content.length/4.2))+' tok';
          }
        }
      } catch(e){
        liveDecodeTps = 0;
        if (e.name === 'AbortError' || PIPELINE.cancelRequested){ outcome = 'cancelled'; }
        else { PIPELINE.abortController = null; throw e; }
      }
      PIPELINE.abortController = null;
    } else {
      const prefillMs = clamp(budget.total/(model.promptTps||60)*1000, 140, 1500);
      await sleep(prefillMs);
      const ttft = Math.round(prefillMs*0.16 + rand(20,60));
      logEvent('METRIC','TTFT '+ttft+' ms (simulated)');
      setPipelineState('GENERATING','streaming response (simulated)');
      const reply = buildSimulatedReply(promptText, chosen, s);
      assistantMsg = {id:uid('msg'), role:'assistant', content:'', createdAt:nowIso(),
        citations:chosen.map(c=>({docId:c.docId, label:c.docName, score:c._score!=null?+c._score.toFixed(3):+rand(0.78,0.97).toFixed(2)})),
        stats:{ttft, tokPerSec:0, tokens:0, simulated:true}};
      s.messages.push(assistantMsg);
      const genTps = model.genTps||30;
      let shown = 0;
      outcome = await new Promise(resolve => {
        PIPELINE.timer = setInterval(() => {
          if (PIPELINE.cancelRequested){ clearInterval(PIPELINE.timer); resolve('cancelled'); return; }
          if (PIPELINE.paused) return;
          shown += Math.max(2, Math.round(genTps/9));
          assistantMsg.content = reply.slice(0, shown);
          assistantMsg.stats.tokens = Math.round(shown/4.2);
          assistantMsg.stats.tokPerSec = +(genTps + rand(-2,2)).toFixed(1);
          renderConvo();
          $('tokenCounter').textContent = assistantMsg.stats.tokens+' tok';
          if (shown >= reply.length){ clearInterval(PIPELINE.timer); resolve('done'); }
        }, 60);
      });
    }

    if (outcome === 'cancelled'){
      assistantMsg.content += '\n\n[generation cancelled]';
      setPipelineState('CANCELLING',''); await sleep(180); setPipelineState('CANCELLED','');
      logEvent('SESSION','generation cancelled by user');
    } else {
      setPipelineState('COMPLETE','');
      logEvent('METRIC', assistantMsg.stats.tokPerSec.toFixed(1)+' tok/s decode'+(assistantMsg.stats.simulated?' (simulated)':' (real, via Ollama)'));
      logEvent('SESSION', assistantMsg.stats.tokens+' tokens · complete');
    }
    s.updatedAt = nowIso(); idbPut('sessions', s);
    renderConvo(); renderSessList();
    setSendButtonRunning(false);
    await sleep(1000);
    if (PIPELINE.sessionId === s.id) setPipelineState('IDLE','');
  } catch(e){
    setPipelineState('ERROR', e && e.message || 'generation failed');
    logEvent('ERROR', e && e.message || 'generation failed');
    setSendButtonRunning(false);
  }
}

function renderInspTabs(){
  $('inspTabs').innerHTML = INSP_TABS.map(([k,label])=>`<button class="insp-tab ${inspectorTab===k?'active':''}" data-tab="${k}">${label}</button>`).join('');

}
function renderInspBody(){
  const s = activeSession();
  const body = $('inspBody');
  if (!s){ body.innerHTML = '<div class="empty-hint">Open a session to inspect its context.</div>'; return; }
  const fns = {context:inspContextHtml, sources:inspSourcesHtml, files:inspFilesHtml, retrieval:inspRetrievalHtml, inference:inspInferenceHtml, runtime:inspRuntimeHtml, trace:inspTraceHtml};
  body.innerHTML = (fns[inspectorTab]||inspContextHtml)(s);
  if (window.lucide) lucide.createIcons();
  bindInspEvents(s);
}
function inspContextHtml(s){
  const b = computeContextBudget(s);
  const rows = [['System', b.system, 'var(--muted-dim)'], ['Conversation', b.conversation, 'var(--blue)'], ['Retrieved context', b.retrieved, 'var(--green)'], ['Files', b.files, 'var(--violet)'], ['Instructions', b.instructions, 'var(--amber)']];
  const stack = rows.filter(r=>r[1]>0).map(([,val,color])=>`<span style="flex:${val};background:${color}"></span>`).join('');
  return `<div class="insp-section"><h3>Context budget</h3>
    <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:7px" class="tnum"><span>${b.total.toLocaleString()} / ${b.max.toLocaleString()}</span><span style="color:var(--muted-dim)">${Math.round(b.total/b.max*100)}%</span></div>
    <div class="budget-stack">${stack}</div>
    <div style="margin-top:10px">${rows.map(([label,val,color])=>`<div class="budget-row"><span><span class="swatch" style="background:${color}"></span>${label}</span><span class="mono">${val.toLocaleString()}</span></div>`).join('')}</div>
    </div>
    <div class="insp-section"><h3>Privacy</h3>${privacyLinesHtml()}</div>`;
}
function privacyLinesHtml(){
  const p = computePrivacyState();
  const lm = loadedModel();
  const lines = [
    ['Local inference', lm && lm.runtimeKind==='local'],
    ['Local embeddings', true],
    ['Network disabled', !getPrefs().webAccess],
    ['Telemetry disabled', !getPrefs().telemetry],
  ];
  return lines.map(([label,ok])=>`<div class="priv-line"><span class="priv-dot" style="background:${ok?'var(--green)':'var(--muted-dim)'}"></span>${label}</div>`).join('')
    + `<div style="margin-top:8px"><span class="badge ${p.cls==='state-good'?'badge-green':p.cls==='state-info'?'badge-blue':'badge-red'}">${p.level}</span></div>`;
}
function inspSourcesHtml(s){
  const lastAssistant = [...s.messages].reverse().find(m=>m.role==='assistant');
  const cites = (lastAssistant && lastAssistant.citations) || [];
  if (!cites.length) return '<div class="insp-section"><h3>Active sources</h3><div class="empty-hint">No sources were used in the last response.</div></div>';
  return '<div class="insp-section"><h3>Active sources</h3>' + cites.map(c=>`<div class="retr-item"><div class="retr-head"><span>${escapeHtml(c.label)}</span><span class="retr-score mono">${Math.round(c.score*100)}%</span></div></div>`).join('') + '</div>';
}
function inspFilesHtml(s){
  const files = s._contextFiles || [];
  return `<div class="insp-section"><h3>Attached files</h3>${files.length ? files.map(f=>`<div class="retr-item" style="font-size:12px">${escapeHtml(f)}</div>`).join('') : '<div class="empty-hint">None attached. Use the paperclip in the composer.</div>'}</div>`;
}
function inspRetrievalHtml(s){
  const excluded = new Set(s.excludedDocIds||[]);
  const lastAssistant = [...s.messages].reverse().find(m=>m.role==='assistant');
  const citedIds = new Set(((lastAssistant&&lastAssistant.citations)||[]).map(c=>c.docId));
  return '<div class="insp-section"><h3>Retrieval — this session</h3>' + DB.knowledgeDocuments.map(d=>{
    const isExcluded = excluded.has(d.id);
    const wasCited = citedIds.has(d.id);
    const scoreLabel = wasCited ? Math.round(lastAssistant.citations.find(c=>c.docId===d.id).score*100)+'%' : (isExcluded?'excluded':'—');
    const chunk = DB.knowledgeChunks.find(c=>c.docId===d.id);
    return `<div class="retr-item ${isExcluded?'retr-excluded':''}">
      <div class="retr-head insp-retr-open" data-doc="${d.id}"><span>${wasCited?'✓':'○'} ${escapeHtml(d.name)}</span><span class="retr-score mono">${scoreLabel}</span></div>
      <div class="retr-body">${chunk?escapeHtml(chunk.text):'No indexed excerpt available.'}</div>
      <div style="margin-top:6px"><button class="btn btn-ghost btn-sm insp-retr-exclude" data-doc="${d.id}">${isExcluded?'Include again':'Exclude from retrieval'}</button></div>
    </div>`;
  }).join('') + '</div>';
}
function inspInferenceHtml(s){
  const p = s.preferences;
  return `<div class="insp-section"><h3>Sampling</h3>
    <div class="slider-row"><label>Temperature <b>${p.temperature.toFixed(2)}</b></label><input type="range" min="0" max="1.5" step="0.05" value="${p.temperature}" data-pref="temperature"></div>
    <div class="slider-row"><label>Top P <b>${p.topP.toFixed(2)}</b></label><input type="range" min="0.1" max="1" step="0.05" value="${p.topP}" data-pref="topP"></div>
    <div class="slider-row"><label>Top K <b>${p.topK}</b></label><input type="range" min="1" max="100" step="1" value="${p.topK}" data-pref="topK"></div>
    <div class="slider-row"><label>Repeat penalty <b>${p.repeatPenalty.toFixed(2)}</b></label><input type="range" min="1" max="1.5" step="0.02" value="${p.repeatPenalty}" data-pref="repeatPenalty"></div>
    <div class="slider-row"><label>Max output <b>${p.maxTokens}</b></label><input type="range" min="128" max="8192" step="128" value="${p.maxTokens}" data-pref="maxTokens"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;font-size:11.5px;margin-top:10px"><span>Seed</span><input class="mono" id="seedInput" style="width:84px;background:#ffffff08;border:1px solid var(--line);border-radius:6px;padding:4px 6px;text-align:right;color:var(--ink)" placeholder="Auto" value="${p.seed==null?'':p.seed}"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><span style="font-size:11.5px">Streaming</span><button class="toggle ${p.streaming?'on':''}" id="streamingToggle"></button></div>
    </div>`;
}
function inspRuntimeHtml(){
  // kvCache/kvCacheMax and thermal are honestly-null (see TELE's own comment
  // above stepTelemetry) on every platform — Ollama's API never exposes
  // per-request KV occupancy and Node has no portable thermal read. The main
  // Runtime view (~line 3163) already guards both; this mini panel didn't,
  // so it threw on every open rather than only where hardware lacked a
  // sensor. Mirror that view's own guard + wording instead of assuming a number.
  const kvKnown = TELE.kvCache!=null && TELE.kvCacheMax!=null;
  return `<div class="insp-section"><h3>Runtime</h3>
    <div class="kv tnum"><span>KV cache</span><span>${kvKnown?TELE.kvCache.toLocaleString()+' / '+TELE.kvCacheMax.toLocaleString():'Not exposed by Ollama'}</span><span>Thermal</span><span>${TELE.thermal!=null?Math.round(TELE.thermal)+'°C':'Unavailable'}</span><span>Prompt tok/s</span><span>${loadedModel()?.promptTps ?? '—'}</span><span>Decode tok/s</span><span>${TELE.tokps.toFixed(1)}</span></div>
    <button class="btn btn-line btn-sm" style="margin-top:10px;width:100%" onclick="showView('runtime')">Open Runtime view</button></div>`;
}
function inspTraceHtml(){
  const recent = DB.runtimeEvents.slice(-8).slice().reverse();
  return `<div class="insp-section"><h3>Recent trace</h3>${recent.map(e=>`<div class="mono" style="font-size:10.5px;color:var(--muted);margin-bottom:5px">${fmtClock(e.at)} <span style="color:var(--amber)">${e.category}</span> ${escapeHtml(e.message)}</div>`).join('')||'<div class="empty-hint">No events yet.</div>'}
    <button class="btn btn-line btn-sm" style="margin-top:6px;width:100%" onclick="showView('trace')">Open Trace view</button></div>`;
}
function bindInspEvents(s){
  $$('[data-pref]').forEach(inp => inp.oninput = () => {
    const key = inp.dataset.pref; const val = Number(inp.value);
    s.preferences[key] = val; idbPut('sessions', s); renderInspBody();
  });
  const seedInput = $('seedInput');
  if (seedInput) seedInput.onchange = () => { s.preferences.seed = seedInput.value.trim()===''? null : Number(seedInput.value); idbPut('sessions', s); };
  const streamToggle = $('streamingToggle');
  if (streamToggle) streamToggle.onclick = () => { s.preferences.streaming = !s.preferences.streaming; streamToggle.classList.toggle('on', s.preferences.streaming); idbPut('sessions', s); };
  $$('.insp-retr-open').forEach(el => el.onclick = () => el.closest('.retr-item').classList.toggle('open'));
  $$('.insp-retr-exclude').forEach(b => b.onclick = () => {
    s.excludedDocIds = s.excludedDocIds || [];
    const i = s.excludedDocIds.indexOf(b.dataset.doc);
    if (i>=0) s.excludedDocIds.splice(i,1); else s.excludedDocIds.push(b.dataset.doc);
    idbPut('sessions', s); renderInspBody();
  });
}

let sessionsTagFilter = null;
let sessionsBulkSelected = new Set();
function allSessionTags(){ const t=new Set(); DB.sessions.forEach(s=>(s.tags||[]).forEach(x=>t.add(x))); return Array.from(t).sort(); }
function groupSessionsForBrowser(){
  const list = DB.sessions.slice().sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt)).filter(s=>!sessionsTagFilter || (s.tags||[]).includes(sessionsTagFilter));
  return {
    Pinned: list.filter(s=>s.pinned && !s.archived),
    Today: list.filter(s=>!s.pinned && !s.archived && isToday(s.updatedAt)),
    Previous: list.filter(s=>!s.pinned && !s.archived && !isToday(s.updatedAt)),
    Archived: list.filter(s=>s.archived),
  };
}
function renderSessionsView(){
  const root = $('sessionsView').querySelector('.view-pad');
  const tags = allSessionTags();
  const groups = groupSessionsForBrowser();
  const sections = ['Pinned','Today','Previous','Archived'].map(label=>{
    const list = groups[label]; if (!list.length) return '';
    return `<div class="sess-group-label" style="margin-top:4px">${label} · ${list.length}</div>
      <div class="card-grid cols-3">${list.map(sessionBrowserCardHtml).join('')}</div>`;
  }).join('');
  root.innerHTML = `
    <div class="view-head">
      <div><span class="eyebrow">Workspace</span><h1 class="view-title">Sessions</h1><p class="view-desc">Every local conversation, grouped the same way as the rail, with tag filters and bulk actions.</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <button class="btn btn-line btn-sm" id="sessBulkPin">Pin selected</button>
        <button class="btn btn-line btn-sm" id="sessBulkArchive">Archive selected</button>
        <button class="btn btn-danger btn-sm" id="sessBulkDelete">Delete selected</button>
        <button class="btn btn-amber btn-sm" id="sessNewBtn"><span data-lucide="plus" style="width:13px;height:13px"></span>New session</button>
      </div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px">
      <button class="tag-chip sess-tag-filter ${!sessionsTagFilter?'active-tag':''}" data-tag="">All tags</button>
      ${tags.map(t=>`<button class="tag-chip sess-tag-filter ${sessionsTagFilter===t?'active-tag':''}" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</button>`).join('')}
    </div>
    ${sections || '<div class="empty-hint">No sessions match this filter.</div>'}`;
  if (window.lucide) lucide.createIcons();
  bindSessionsViewEvents();
}
function sessionBrowserCardHtml(s){
  const m = modelById(s.modelId);
  const checked = sessionsBulkSelected.has(s.id);
  return `<div class="panel" style="padding:12px;cursor:pointer" data-open="${s.id}">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
      <label style="display:flex;gap:8px;align-items:flex-start;min-width:0" onclick="event.stopPropagation()">
        <input type="checkbox" class="sess-bulk-check" data-id="${s.id}" ${checked?'checked':''} style="margin-top:3px">
        <strong style="font-size:13px;line-height:1.3">${escapeHtml(s.title)}</strong>
      </label>
      ${s.pinned?'<span data-lucide="pin" style="width:12px;height:12px;color:var(--amber);flex:none"></span>':''}
    </div>
    <div class="mono" style="font-size:10.5px;color:var(--muted-dim);margin-top:8px">${fmtRelDate(s.updatedAt)} · ${s.messages.length} msg · ${m?m.quant:'—'}</div>
    ${(s.tags||[]).length?`<div class="sess-tags" style="margin-top:8px">${s.tags.map(t=>`<span class="tag-chip">${escapeHtml(t)}</span>`).join('')}</div>`:''}
  </div>`;
}
function bindSessionsViewEvents(){
  $$('.sess-tag-filter').forEach(b=>b.onclick=()=>{ sessionsTagFilter = b.dataset.tag || null; renderSessionsView(); });
  $$('[data-open]').forEach(el=>el.onclick=(e)=>{ if (e.target.closest('label')) return; activeSessionId = el.dataset.open; showView('console'); });
  $$('.sess-bulk-check').forEach(cb=>cb.onchange=()=>{ if (cb.checked) sessionsBulkSelected.add(cb.dataset.id); else sessionsBulkSelected.delete(cb.dataset.id); });
  $('sessNewBtn').onclick = () => createSession();
  $('sessBulkPin').onclick = () => bulkSessionAction(s=>{ s.pinned = true; });
  $('sessBulkArchive').onclick = () => bulkSessionAction(s=>{ s.archived = true; s.pinned = false; });
  $('sessBulkDelete').onclick = () => {
    if (!sessionsBulkSelected.size) return toast('No sessions selected.');
    const n = sessionsBulkSelected.size;
    sessionsBulkSelected.forEach(id=>idbDelete('sessions', id));
    if (sessionsBulkSelected.has(activeSessionId)) activeSessionId = visibleSessions().filter(s=>!s.archived)[0]?.id || null;
    sessionsBulkSelected.clear();
    toast(n+' session(s) deleted.'); renderSessionsView(); renderSessList();
  };
}
function bulkSessionAction(fn){
  if (!sessionsBulkSelected.size) return toast('No sessions selected.');
  const n = sessionsBulkSelected.size;
  sessionsBulkSelected.forEach(id=>{ const s = sessionById(id); if (s){ fn(s); s.updatedAt = nowIso(); idbPut('sessions', s); } });
  sessionsBulkSelected.clear();
  toast('Updated '+n+' session(s).'); renderSessionsView(); renderSessList();
}

    } catch(e) {
      toast('Could not reach Ollama: '+e.message);
      logEvent('ERROR', 'model sync failed: '+e.message);
    }
  };
  $$('.model-load').forEach(b=>b.onclick=async ()=>{
    const m = modelById(b.dataset.id); if (!m) return;
    if (m.runtime !== 'ollama'){ m.loaded = true; idbPut('models', m); logEvent('MODEL', m.name+' loaded (simulated — not an Ollama model)'); renderModelsView(); renderShellChrome(); toast(m.name+' loaded.'); return; }
    b.disabled = true; b.textContent = 'Loading…'; toast('Loading '+m.name+' into Ollama…');
    try {
      const r = await fetch(apiUrl('/api/models/'+encodeURIComponent(m.id)+'/load'), {method:'POST'});
      if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.error || ('HTTP '+r.status)); }
      const updated = await r.json(); idbPut('models', updated);
      logEvent('MODEL', m.name+' loaded'); toast(m.name+' loaded.');
    } catch(e) { toast('Load failed: '+e.message); logEvent('ERROR', m.name+' load failed: '+e.message); }
    await refreshOllamaStatus(); renderModelsView(); renderShellChrome();
  });
  $$('.model-unload').forEach(b=>b.onclick=async ()=>{
    const m = modelById(b.dataset.id); if (!m) return;
    if (m.runtime !== 'ollama'){ m.loaded = false; idbPut('models', m); logEvent('MODEL', m.name+' unloaded (simulated)'); renderModelsView(); renderShellChrome(); toast(m.name+' unloaded.'); return; }
    b.disabled = true; b.textContent = 'Unloading…';
    try {
      const r = await fetch(apiUrl('/api/models/'+encodeURIComponent(m.id)+'/unload'), {method:'POST'});
      if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.error || ('HTTP '+r.status)); }
      const updated = await r.json(); idbPut('models', updated);
      logEvent('MODEL', m.name+' unloaded'); toast(m.name+' unloaded.');
    } catch(e) { toast('Unload failed: '+e.message); logEvent('ERROR', m.name+' unload failed: '+e.message); }
    await refreshOllamaStatus(); renderModelsView(); renderShellChrome();
  });
  $$('.model-duplicate').forEach(b=>b.onclick=()=>{
    const m = modelById(b.dataset.id);
    idbPut('modelProfiles', {id:uid('mp'), name:m.name+' · copy', modelId:m.id, temperature:0.7, topP:0.9, topK:40, repeatPenalty:1.1, maxTokens:2048, createdAt:nowIso()});
    toast('Profile duplicated.'); renderModelsView();
  });
  $$('.model-benchmark').forEach(b=>b.onclick=async ()=>{
    const m = modelById(b.dataset.id); if (!m) return;
    if (m.runtime !== 'ollama'){
      toast('Benchmarking '+m.name+'…'); logEvent('MODEL','benchmark started · '+m.name+' (simulated)');
      await sleep(900);
      m.promptTps = Math.round((m.promptTps||60)*rand(0.96,1.05));
      m.genTps = Math.round((m.genTps||25)*rand(0.96,1.05));
      m.ttft = Math.round((m.ttft||200)*rand(0.95,1.05));
      idbPut('models', m);
      logEvent('METRIC', m.name+' benchmark (simulated): '+m.genTps+' tok/s decode, TTFT '+m.ttft+' ms');
      renderModelsView(); toast('Benchmark complete.');
      return;
    }
    b.disabled = true; b.textContent = 'Benchmarking…';
    toast('Benchmarking '+m.name+' against Ollama…'); logEvent('MODEL','benchmark started · '+m.name);
    try {
      const r = await fetch(apiUrl('/api/models/'+encodeURIComponent(m.id)+'/benchmark'), {method:'POST'});
      if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.error || ('HTTP '+r.status)); }
      const { model: updated } = await r.json();
      idbPut('models', updated);
      logEvent('METRIC', updated.name+' benchmark: '+updated.genTps+' tok/s decode, TTFT '+updated.ttft+' ms (real, via Ollama)');
      toast('Benchmark complete.');
    } catch(e) { toast('Benchmark failed: '+e.message); logEvent('ERROR', m.name+' benchmark failed: '+e.message); }
    await refreshOllamaStatus(); renderModelsView(); renderShellChrome();
  });
  $$('.model-reveal').forEach(b=>b.onclick=()=>toast('Reveal-in-folder is disabled in this browser prototype.'));
  $$('.model-delete').forEach(b=>b.onclick=()=>{
    if (b.dataset.confirm){ idbDelete('models', b.dataset.id); toast('Model removed from registry.'); renderModelsView(); }
    else { b.dataset.confirm = '1'; b.textContent = 'Confirm delete'; }
  });
  $$('.profile-delete').forEach(b=>b.onclick=()=>{ idbDelete('modelProfiles', b.dataset.id); renderModelsView(); });
}

function bindKnowledgeViewEvents(){
  $('kNewCollectionBtn').onclick = () => {
    idbPut('knowledgeCollections', {id:uid('kc'), name:'Collection '+(DB.knowledgeCollections.length+1), status:'pending', embeddingModel:'nomic-embed-text', docCount:0, chunkCount:0, lastIndexed:null});
    renderKnowledgeView(); toast('Collection created.');
  };
  $('kAddSourceBtn').onclick = () => {
    if (!DB.knowledgeCollections.length){ toast('Create a collection first.'); return; }
    if (!ollamaStatus.reachable){ toast('Ollama is not reachable — cannot embed new sources right now.'); return; }
    $('kFileInput').click();
  };
  $('kFileInput').onchange = async () => {
    const input = $('kFileInput');
    const files = Array.from(input.files || []);
    input.value = '';
    if (!files.length) return;
    const collectionId = $('kAddSourceCollection').value || (DB.knowledgeCollections[0] && DB.knowledgeCollections[0].id);
    if (!collectionId) { toast('Create a collection first.'); return; }
    for (const file of files){
      let text;
      try { text = await file.text(); }
      catch(e){ toast('Could not read '+file.name+' as text.'); continue; }
      if (!text.trim()){ toast(file.name+' is empty — skipped.'); continue; }
      toast('Embedding '+file.name+'…');
      try {
        const r = await fetch(apiUrl('/api/knowledge/ingest'), {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ collectionId, name: file.name, text }),
        });
        if (!r.ok){ const e = await r.json().catch(()=>({})); throw new Error(e.error || ('HTTP '+r.status)); }
        const result = await r.json();
        idbPut('knowledgeDocuments', result.document);
        if (result.collection) idbPut('knowledgeCollections', result.collection);
        DB.knowledgeChunks = await idbAll('knowledgeChunks');
        logEvent('RAG', file.name+' ingested — '+result.chunkCount+' real chunks, real embeddings ('+result.document.embeddingModel+')');
        toast(file.name+' indexed ('+result.chunkCount+' chunks).');
      } catch(e) {
        toast('Failed to index '+file.name+': '+e.message);
        logEvent('ERROR', 'ingest failed for '+file.name+': '+e.message);
      }
    }
    renderKnowledgeView();
  };
  $$('.k-reindex').forEach(b=>b.onclick=async ()=>{
    const c = DB.knowledgeCollections.find(x=>x.id===b.dataset.id); if (!c) return;
    b.disabled = true; b.textContent = 'Re-indexing…';
    toast('Re-indexing '+c.name+'…'); logEvent('RAG','re-index started · '+c.name);
    try {
      const r = await fetch(apiUrl('/api/knowledge/reindex/'+encodeURIComponent(c.id)), {method:'POST'});
      if (!r.ok){ const e = await r.json().catch(()=>({})); throw new Error(e.error || ('HTTP '+r.status)); }
      const result = await r.json();
      if (result.collection) idbPut('knowledgeCollections', result.collection);
      DB.knowledgeChunks = await idbAll('knowledgeChunks');
      DB.knowledgeDocuments = await idbAll('knowledgeDocuments');
      const skippedNote = result.skippedDocs ? ' — '+result.skippedDocs+' seeded doc(s) skipped (no stored source text to re-chunk)' : '';
      logEvent('RAG', 're-index complete · '+c.name+' — '+result.reindexedDocs+'/'+result.totalDocs+' docs'+skippedNote);
      toast('Re-index complete.'+skippedNote);
    } catch(e) {
      toast('Re-index failed: '+e.message); logEvent('ERROR', 're-index failed: '+e.message);
    }
    renderKnowledgeView();
  });
  $$('.k-open-lab').forEach(b=>b.onclick=()=>{ retrievalLab.collectionId = b.dataset.id; showView('retrieval'); });
  $$('.k-doc-delete').forEach(b=>b.onclick=async ()=>{
    const id = b.dataset.id;
    try {
      const r = await fetch(apiUrl('/api/knowledge/documents/'+encodeURIComponent(id)), {method:'DELETE'});
      if (r.ok){ const result = await r.json(); if (result.collection) idbPut('knowledgeCollections', result.collection); }
    } catch(e) { /* still clear it locally below so the UI doesn't strand a stale row */ }
    DB.knowledgeDocuments = (DB.knowledgeDocuments||[]).filter(d=>d.id!==id);
    DB.knowledgeChunks = (DB.knowledgeChunks||[]).filter(c=>c.docId!==id);
    toast('Document removed.'); renderKnowledgeView();
  });
}

      <select id="labCollection" class="mono" style="font-size:11px;background:transparent;border:1px solid var(--line-soft);border-radius:6px;padding:6px 8px;color:var(--ink-dim)" ${canSearch?'':'disabled'}>${collOptions}</select>
      <button class="btn btn-amber btn-sm" id="labRunBtn" ${canSearch?'':'disabled'}><span data-lucide="search" style="width:12px;height:12px"></span>${retrievalLab.loading?'Searching…':'Search'}</button>
    </div>

      <div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span class="eyebrow">Candidate chunks${retrievalLab.usedRealEmbeddings?' · real vector search ('+escapeHtml(retrievalLab.embeddingModel||'')+')':''}</span>
          <button class="btn btn-line btn-sm" id="labRerankBtn" ${retrievalLab.results.length?'':'disabled'}>${retrievalLab.reranked?'Hybrid rerank ✓':'Hybrid rerank'}</button></div>
        <div id="labResults"></div>
        ${retrievalLab.reranked?'<div class="empty-hint" style="margin-top:8px">Hybrid rerank = BM25 (lexical) + vector cosine, fused by Reciprocal Rank Fusion. No cross-encoder is involved.</div>':''}
      </div>
      <div>
        <span class="eyebrow">Selected context</span>
        <div class="panel" style="padding:14px;margin-top:8px" id="labSelectedPanel"></div>
      </div>
    </div>`;
  renderLabResults(); renderLabSelected();
  if (window.lucide) lucide.createIcons();
  bindRetrievalViewEvents();
}
async function runRetrievalQuery(query){
  retrievalLab.query = query; retrievalLab.reranked = false; retrievalLab.loading = true; retrievalLab.reason = '';
  try {
    const r = await fetch(apiUrl('/api/knowledge/search'), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({query, topK:6, collectionId: retrievalLab.collectionId || undefined, rerank:false}),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || ('HTTP '+r.status));
    retrievalLab.usedRealEmbeddings = !!data.usedRealEmbeddings;
    retrievalLab.embeddingModel = data.embeddingModel || null;
    retrievalLab.reason = data.reason || '';
    retrievalLab.results = (data.results||[]).map(res=>({
      chunk:{id:res.id, docId:res.docId, docName:res.docName, text:res.text},
      score: res.vectorScore, rank: res.rank || null,
    }));
    retrievalLab.selectedIds = new Set(retrievalLab.results.slice(0,2).map(r=>r.chunk.id));
    if (retrievalLab.usedRealEmbeddings){
      logEvent('RAG', 'lab query: "'+query.slice(0,60)+'" → '+retrievalLab.results.length+' real candidates (cosine, model '+retrievalLab.embeddingModel+')');
    } else {
      logEvent('RAG', 'lab query: "'+query.slice(0,60)+'" → '+(data.reason||'no results'));
    }
  } catch(e) {
    retrievalLab.usedRealEmbeddings = false; retrievalLab.results = []; retrievalLab.selectedIds = new Set();
    retrievalLab.reason = 'Search failed: '+e.message;
    logEvent('ERROR', 'lab query failed: '+e.message);
  } finally {
    retrievalLab.loading = false;
  }
}
async function rerankLabResults(){
  if (!retrievalLab.query) return;
  try {
    const r = await fetch(apiUrl('/api/knowledge/search'), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({query: retrievalLab.query, topK:6, collectionId: retrievalLab.collectionId || undefined, rerank:true}),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || ('HTTP '+r.status));
    retrievalLab.results = (data.results||[]).map(res=>({
      chunk:{id:res.id, docId:res.docId, docName:res.docName, text:res.text},
      score: res.vectorScore, bm25Score: res.bm25Score, rerankScore: res.rerankScore, rank: res.rank,
    }));
    retrievalLab.reranked = true;
    logEvent('RAG', 'hybrid rerank (BM25 + vector, RRF) applied to '+retrievalLab.results.length+' candidates');
  } catch(e) {
    toast('Rerank failed: '+e.message);
    logEvent('ERROR', 'lab rerank failed: '+e.message);
  }
}
function renderLabResults(){
  const root = $('labResults'); if (!root) return;
  if (retrievalLab.loading){ root.innerHTML = '<div class="empty-hint">Searching…</div>'; return; }
  if (!retrievalLab.results.length){
    root.innerHTML = `<div class="empty-hint">${escapeHtml(retrievalLab.reason || 'Run a query to see candidate chunks.')}</div>`;
    return;
  }
  root.innerHTML = retrievalLab.results.map(r=>{
    const sel = retrievalLab.selectedIds.has(r.chunk.id);
    const metrics = retrievalLab.reranked
      ? `#${r.rank} · sim ${r.score.toFixed(2)} · bm25 ${r.bm25Score.toFixed(2)} · rrf ${r.rerankScore.toFixed(4)}`
      : (r.rank?'#'+r.rank+' · ':'')+'sim '+r.score.toFixed(2);
    return `<div class="chunk-card" style="${sel?'border-color:var(--amber-line);background:var(--amber-soft)':''}">
      <div style="display:flex;justify-content:space-between;gap:8px"><strong style="font-size:11.5px">${escapeHtml(r.chunk.docName)}</strong>
        <span class="mono" style="color:var(--muted-dim)">${metrics}</span></div>
      <div style="color:var(--muted);margin:6px 0">${escapeHtml(r.chunk.text)}</div>
      <label style="display:flex;gap:6px;align-items:center;font-size:11px;color:var(--ink-dim)"><input type="checkbox" class="lab-select" data-id="${r.chunk.id}" ${sel?'checked':''}>Include in selected context</label>
    </div>`;
  }).join('');
}
function renderLabSelected(){
  const root = $('labSelectedPanel'); if (!root) return;
  const selected = retrievalLab.results.filter(r=>retrievalLab.selectedIds.has(r.chunk.id));
  const tokenCost = selected.reduce((sum,r)=>sum+Math.round(r.chunk.text.length/4), 0);
  root.innerHTML = selected.length ? `
    ${selected.map(r=>`<div style="font-size:11.5px;margin-bottom:8px"><strong>${escapeHtml(r.chunk.docName)}</strong><div style="color:var(--muted);margin-top:2px">${escapeHtml(r.chunk.text.slice(0,140))}${r.chunk.text.length>140?'…':''}</div></div>`).join('')}
    <div class="kv tnum" style="margin-top:10px;border-top:1px solid var(--line-soft);padding-top:10px"><span>Selected chunks</span><span>${selected.length}</span><span>Estimated token cost</span><span>${tokenCost.toLocaleString()}</span></div>
  ` : '<div class="empty-hint">Nothing selected yet — check a chunk on the left.</div>';
}
function rebindLabResultEvents(){
  $$('.lab-select').forEach(cb=>cb.onchange=()=>{
    if (cb.checked) retrievalLab.selectedIds.add(cb.dataset.id); else retrievalLab.selectedIds.delete(cb.dataset.id);
    renderLabResults(); renderLabSelected(); rebindLabResultEvents();
  });
}
function bindRetrievalViewEvents(){
  $('labRunBtn').onclick = async () => {
    const q = $('labQuery').value.trim(); if (!q || retrievalLab.loading) return;
    retrievalLab.loading = true; renderRetrievalView();
    await runRetrievalQuery(q);
    renderRetrievalView();
  };
  $('labQuery').onkeydown = e => { if (e.key==='Enter') $('labRunBtn').click(); };
  $('labCollection').onchange = e => { retrievalLab.collectionId = e.target.value; };
  $('labRerankBtn').onclick = async () => {
    await rerankLabResults(); renderRetrievalView();
  };
  rebindLabResultEvents();
}

  };
  $$('.auto-enable').forEach(b=>b.onclick=()=>configureAutomationRemote(b.dataset.id, {status:'Enabled'}, 'enabled'));
  $$('.auto-disable').forEach(b=>b.onclick=()=>configureAutomationRemote(b.dataset.id, {status:'Draft'}, 'set to draft'));
  $$('.auto-run-now').forEach(b=>b.onclick=()=>runAutomationNow(b.dataset.id));

function bindAutomationEditorEvents(){
  if (!automationsEditingId || !$('aeSave')) return;
  $$('.ae-coll-pick').forEach(b=>b.onclick=()=>{ aeSelectedCollections.has(b.dataset.id) ? aeSelectedCollections.delete(b.dataset.id) : aeSelectedCollections.add(b.dataset.id); b.classList.toggle('active-tag'); });
  $$('input[name="aeTriggerType"]').forEach(r=>r.onchange=()=>{
    const isEvent = document.querySelector('input[name="aeTriggerType"]:checked').value === 'event';
    $('aeScheduleFields').style.display = isEvent ? 'none' : '';
    $('aeEventFields').style.display = isEvent ? '' : 'none';
  });
  const kindSel = $('aeSchedKind');
  if (kindSel) kindSel.onchange = () => {
    const k = kindSel.value;
    $('aeSchedIntervalWrap').style.display = k==='interval' ? '' : 'none';
    $('aeSchedWeekdayWrap').style.display = k==='weekly' ? '' : 'none';
    $('aeSchedTimeWrap').style.display = k==='interval' ? 'none' : '';
  };
  $('aeCancel').onclick = () => { automationsEditingId = null; renderAutomationsView(); };
  $('aeSave').onclick = async () => {
    const id = $('aeSave').dataset.id;
    const triggerType = document.querySelector('input[name="aeTriggerType"]:checked').value;
    let trigger;
    if (triggerType === 'event') {
      trigger = {type:'event', event:'document_added', collectionId: $('aeEventCollection').value || null};
    } else {
      const kind = $('aeSchedKind').value;
      const [hh,mm] = ($('aeSchedTime').value || '07:30').split(':').map(Number);
      const schedule = kind==='interval' ? {kind, everyMinutes:Number($('aeSchedEvery').value)||60}
        : kind==='weekly' ? {kind, weekday:Number($('aeSchedWeekday').value)||0, hour:hh, minute:mm}
        : {kind, hour:hh, minute:mm};
      trigger = {type:'schedule', schedule};
    }
    const patch = {name:$('aeName').value, modelId:$('aeModel').value, collections:Array.from(aeSelectedCollections), trigger};
    automationsEditingId = null;
    await configureAutomationRemote(id, patch, 'updated');
  };
}
/** Every mutation to an automation's config goes through the server's
 *  /api/automations/:id/configure — the one real place nextRun is computed
 *  (lib/scheduler.js) — never hand-set on the client, so it can't drift
 *  from what the scheduler will actually do. */
async function configureAutomationRemote(id, patch, verb){
  try {
    const r = await fetch(apiUrl('/api/automations/'+encodeURIComponent(id)+'/configure'), {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(patch)});
    const a = await r.json();
    if (!r.ok) throw new Error(a.error || ('HTTP '+r.status));
    const i = DB.automations.findIndex(x=>x.id===id);
    if (i>=0) DB.automations[i] = a; else DB.automations.push(a);
    logEvent('AUTOMATION', a.name+' '+verb+(a.status==='Enabled'&&a.nextRun?' · next run '+fmtRelDate(a.nextRun):''));
    renderAutomationsView(); toast(a.name+' '+verb+'.');
  } catch(e) {
    DB.automations = await idbAll('automations');
    toast('Could not update automation: '+e.message);
    renderAutomationsView();
  }
}
async function runAutomationNow(id){
  const a = DB.automations.find(x=>x.id===id); if (!a || runningAutomationIds.has(id)) return;
  runningAutomationIds.add(id); renderAutomationsView();
  logEvent('AUTOMATION', a.name+' · run started (manual)');
  try {
    const r = await fetch(apiUrl('/api/automations/'+encodeURIComponent(id)+'/run'), {method:'POST'});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || ('HTTP '+r.status));
    idbPut('automations', data.automation); // real result already written server-side; this just syncs the local cache
    logEvent('AUTOMATION', a.name+' · run succeeded · '+data.tokens+' tokens (real eval_count)');
    toast(a.name+' run complete — '+data.tokens+' tokens.');
  } catch(e) {
    DB.automations = await idbAll('automations'); // pick up the failure state the server already persisted
    logEvent('ERROR', a.name+' run failed: '+e.message);
    toast(a.name+' run failed: '+e.message);
  } finally {
    runningAutomationIds.delete(id);
    renderAutomationsView();
  }
}

      // note) — stays on the original simulated path, labeled as such.
      const ex = logExecution('skill', s.name, 'running', 'Invoked from Skills registry (simulated)', s.id);
      logEvent('SKILL', s.name+' run started (simulated)');
      b.disabled = true;
      setTimeout(()=>{
        s.lastRun = nowIso(); s.runCount = (s.runCount||0)+1;
        s.audit = s.audit||[]; s.audit.push({at:nowIso(), action:'Run', detail:'Invoked manually from Skills registry (simulated)'});
        idbPut('skills', s); updateExecution(ex.id, {status:'success', detail:'Completed (simulated)'});

      if (!url) { toast('Enter a URL first.'); return; }

    skillRunBusyIds.add(s.id); renderSkillsView();
    const ex = logExecution('skill', s.name, 'running', 'Real sandboxed run via Skills registry', s.id);
    logEvent('SKILL', s.name+' run started (real, sandboxed worker)');
    try {

        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({inputs}),
      });

      if (!r.ok) throw new Error(data.error || ('HTTP '+r.status));
      idbPut('skills', data.skill);
      updateExecution(ex.id, {status:'success', detail:'Completed — '+JSON.stringify(data.result).slice(0,160)});

      toast(s.name+' completed.');
    } catch(e) {
      updateExecution(ex.id, {status:'failed', detail:e.message});
