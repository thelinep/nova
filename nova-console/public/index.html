    }
  });
}

/* ===================== marker: RENDER:MCP ===================== */
/* Real MCP connections now (Phase 3): Connect spawns a real child process
   and does a real stdio JSON-RPC handshake (lib/mcp.js + mcp-servers/*.js
   on the backend — see their headers for why these are hand-written
   rather than the official SDK/packages). approvalPolicy really gates the
   outgoing tools/call server-side (lib/mcp-manager.js's gatedCall) for
   both this view's manual "Call" button and any skill's declared-tool
   calls — not just a UI banner around an already-decided result. */
const MCP_STATUS_BADGE = {connected:'badge-green', starting:'badge-amber', error:'badge-red', disconnected:'badge-blue'};
function setLocalMcpServer(row){
  DB.mcpServers = DB.mcpServers || [];
  const i = DB.mcpServers.findIndex(r=>r.id===row.id);
  if (i>=0) DB.mcpServers[i] = row; else DB.mcpServers.push(row);
}
function mcpToolRowHtml(t, server){

    <div style="display:flex;justify-content:space-between;gap:8px"><strong style="font-size:12px">${escapeHtml(t.name)}</strong>
      <button class="btn btn-line btn-sm mcp-call-tool" data-server="${server.id}" data-tool="${escapeHtml(t.name)}" ${server.status!=='connected'?'disabled':''}>Call</button></div>
    <div style="color:var(--muted);margin-top:3px">${escapeHtml(t.description)}</div>
    <div class="manifest-box" style="margin-top:6px">${escapeHtml(JSON.stringify(t.inputSchema))}</div>
    <input type="text" class="mcp-tool-args mono" data-server="${server.id}" data-tool="${escapeHtml(t.name)}"
      placeholder='Arguments as JSON${req.length?' — required: '+req.join(', '):''}' style="width:100%;margin-top:6px;font-size:11px;background:transparent;border:1px solid var(--line-soft);border-radius:6px;padding:5px 7px;color:var(--ink)">
  </div>`;
}
function mcpServerCardHtml(s){
  const open = mcpSelectedServerId === s.id;
  const pendingForServer = mcpPendingApprovals.filter(p=>p.serverId===s.id);
  const busy = mcpBusyServerIds.has(s.id);
  const connected = s.status === 'connected';
  const hasRealImpl = s.id === 'mcp_fs' || s.id === 'mcp_git';
  return `<div class="panel mcp-card" data-id="${s.id}">
    <div class="cap-card-head">
      <div><div class="cap-card-title">${escapeHtml(s.name)}</div><div class="cap-card-sub">${escapeHtml(s.transport)} · ${escapeHtml(s.command)}</div></div>
      <span class="badge ${MCP_STATUS_BADGE[s.status]||'badge-blue'}">${s.status}</span>
    </div>
    ${!hasRealImpl ? `<div class="empty-hint" style="margin-top:8px">No real MCP server is wired up for this one yet — connecting will honestly fail rather than fake a connection.</div>` : ''}
    <div class="cap-card-actions">
      <button class="btn btn-amber btn-sm mcp-connect" data-id="${s.id}" ${s.status==='starting'||busy?'disabled':''}>${connected?'Reconnect':'Connect'}</button>
      ${connected ? `<button class="btn btn-line btn-sm mcp-disconnect" data-id="${s.id}" ${busy?'disabled':''}>Disconnect</button>` : ''}
      <button class="btn btn-line btn-sm mcp-inspect" data-id="${s.id}">${open?'Hide tools':'Inspect tools ('+(s.tools||[]).length+')'}</button>
    </div>
    <div class="cap-section-label" style="margin-top:2px">Approval policy</div>
    <div class="policy-radio-group">
      ${['auto','ask','deny'].map(p=>`<button class="policy-radio ${s.approvalPolicy===p?'active':''}" data-id="${s.id}" data-policy="${p}">${p==='auto'?'Auto-approve':p==='ask'?'Ask each time':'Deny'}</button>`).join('')}
    </div>
    ${pendingForServer.map(p=>`<div class="approval-banner"><span>Approval needed: call "<strong>${escapeHtml(p.toolName)}</strong>"${Object.keys(p.arguments||{}).length?' with <span class="mono">'+escapeHtml(JSON.stringify(p.arguments))+'</span>':''}${p.origin==='skill'?' — triggered by skill "'+escapeHtml(p.skillName||'')+'"':''}</span>
      <span style="display:flex;gap:6px"><button class="btn btn-amber btn-sm mcp-approve" data-approval="${p.approvalId}">Approve</button><button class="btn btn-ghost btn-sm mcp-reject" data-approval="${p.approvalId}">Reject</button></span></div>`).join('')}
    ${open ? `
      <div class="cap-section-label">Tools</div>
      ${(s.tools||[]).map(t=>mcpToolRowHtml(t,s)).join('') || '<div class="empty-hint">No tools reported yet — connect first.</div>'}
      <div class="cap-section-label">Permissions</div>
      ${(s.permissions||[]).map(p=>`<div class="perm-row"><span class="perm-name">${escapeHtml(p.label)}</span><span class="perm-scope">${escapeHtml(p.scope)} · ${p.granted?'granted':'revoked'}</span></div>`).join('') || '<div class="empty-hint">None declared.</div>'}

function renderMcpView(){
  const pad = $('mcpView').querySelector('.view-pad');
  pad.innerHTML = `
    <div class="view-head">
      <div><span class="eyebrow">Capabilities</span><h1 class="view-title">MCP Registry</h1><p class="view-desc">Local tool servers this workspace can reach. Connect spawns a real process and does a real stdio handshake; every call goes through the server's actual approval policy before it would ever reach a skill or agent.</p></div>
    </div>
    <div class="cap-grid">${DB.mcpServers.map(mcpServerCardHtml).join('') || '<div class="empty-hint">No MCP servers configured.</div>'}</div>
  `;
  bindMcpView();
}
function bindMcpView(){
  $$('.mcp-inspect').forEach(b=>b.onclick=()=>{ mcpSelectedServerId = mcpSelectedServerId===b.dataset.id ? null : b.dataset.id; renderMcpView(); });
  $$('.policy-radio').forEach(b=>b.onclick=()=>{
    const s = DB.mcpServers.find(x=>x.id===b.dataset.id); if (!s) return;
    s.approvalPolicy = b.dataset.policy; idbPut('mcpServers', s);
    logEvent('MCP', s.name+' approval policy set to '+b.dataset.policy); renderMcpView();
  });
  $$('.mcp-connect').forEach(b=>b.onclick=async ()=>{
    const id = b.dataset.id; mcpBusyServerIds.add(id); renderMcpView();
    logEvent('MCP', (DB.mcpServers.find(x=>x.id===id)||{}).name+' connect requested');
    try {
      const r = await fetch(apiUrl('/api/mcp/'+encodeURIComponent(id)+'/connect'), {method:'POST'});
      const row = await r.json();
      if (!r.ok) throw new Error(row.error || ('HTTP '+r.status));
      setLocalMcpServer(row);
      logEvent('MCP', row.name+' connected — protocolVersion from real handshake, '+(row.tools||[]).length+' tool(s)');
      logExecution('mcp', row.name+' · connect', 'success', 'Real MCP handshake completed', row.id);
      toast(row.name+' connected.');
    } catch(e) {
      toast('Connect failed: '+e.message);
      logEvent('ERROR', 'MCP connect failed for '+id+': '+e.message);
      logExecution('mcp', id+' · connect', 'failed', e.message, id);
      const r2 = await fetch(apiUrl('/api/store/mcpServers')); if (r2.ok) { const rows = await r2.json(); const row = rows.find(x=>x.id===id); if (row) setLocalMcpServer(row); }
    } finally {
      mcpBusyServerIds.delete(id); renderMcpView();
    }
  });
  $$('.mcp-disconnect').forEach(b=>b.onclick=async ()=>{
    const id = b.dataset.id; mcpBusyServerIds.add(id); renderMcpView();
    try {
      const r = await fetch(apiUrl('/api/mcp/'+encodeURIComponent(id)+'/disconnect'), {method:'POST'});
      const row = await r.json();
      if (r.ok) { setLocalMcpServer(row); logEvent('MCP', row.name+' disconnected'); toast(row.name+' disconnected.'); }
    } catch(e) { toast('Disconnect failed: '+e.message); }
    finally { mcpBusyServerIds.delete(id); renderMcpView(); }
  });
  $$('.mcp-approve, .mcp-reject').forEach(b=>b.onclick=async ()=>{
    const approvalId = b.dataset.approval;
    const decision = b.classList.contains('mcp-approve') ? 'approve' : 'reject';
    try {
      const r = await fetch(apiUrl('/api/mcp/approvals/'+encodeURIComponent(approvalId)+'/'+decision), {method:'POST'});
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || ('HTTP '+r.status));
      if (data.status === 'ok') {
        const text = (data.result && data.result.content || []).map(c=>c.text).filter(Boolean).join('\n');
        toast('Approved — ' + (text.length>80?text.slice(0,80)+'…':text||'completed'));
        logEvent('APPROVAL', 'call approved and executed for real');
      } else {
        toast('Call rejected.'); logEvent('APPROVAL', 'call rejected');
      }
    } catch(e) { toast('Failed: '+e.message); }
    await refreshMcpApprovals();
    const r2 = await fetch(apiUrl('/api/store/mcpServers')); if (r2.ok) { DB.mcpServers = await r2.json(); }
    renderMcpView();
  });
  $$('.mcp-call-tool').forEach(b=>b.onclick=async ()=>{
    const s = DB.mcpServers.find(x=>x.id===b.dataset.server); if (!s) return;
    const toolName = b.dataset.tool;
    const argsInput = document.querySelector('.mcp-tool-args[data-server="'+s.id+'"][data-tool="'+toolName.replace(/"/g,'\\"')+'"]');
    let args = {};
    if (argsInput && argsInput.value.trim()) {
      try { args = JSON.parse(argsInput.value); } catch(e) { toast('Arguments must be valid JSON.'); return; }
    }
    try {
      const r = await fetch(apiUrl('/api/mcp/'+encodeURIComponent(s.id)+'/call'), {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({toolName, arguments: args}),
      });
      const data = await r.json();
      if (r.status === 202 && data.pending) {
        logEvent('APPROVAL', toolName+' call on '+s.name+' awaiting approval');
        toast('Awaiting approval for '+toolName+'.');
        await refreshMcpApprovals();
      } else if (r.ok) {
        const text = (data.result && data.result.content || []).map(c=>c.text).filter(Boolean).join('\n');
        logEvent('TOOL', toolName+' via '+s.name+' → ok ('+text.length+' chars)');
        logExecution('mcp', s.name+' · '+toolName, 'success', 'Real tool call returned '+text.length+' chars', s.id);
        toast(toolName+' → '+(text.length>80?text.slice(0,80)+'…':text||'ok'));
      } else {
        throw new Error(data.error || ('HTTP '+r.status));
      }
    } catch(e) {
      logEvent('ERROR', toolName+' call on '+s.name+' failed: '+e.message);
      logExecution('mcp', s.name+' · '+toolName, 'failed', e.message, s.id);
      toast('Call failed: '+e.message);
    }
    const r2 = await fetch(apiUrl('/api/store/mcpServers')); if (r2.ok) { DB.mcpServers = await r2.json(); }
    renderMcpView();
  });
}

/* ===================== marker: RENDER:TRACE ===================== */
const TRACE_CATS = ['SESSION','MODEL','RAG','FILE','AUTOMATION','SKILL','MCP','AGENT','WORKFLOW','TOOL','APPROVAL','ERROR','METRIC'];
let traceFilter = new Set(TRACE_CATS);
let traceQuery = '';
const TRACE_CAT_COLOR = {SESSION:'var(--blue)', MODEL:'var(--amber)', RAG:'var(--green)', FILE:'var(--violet)', AUTOMATION:'var(--blue)',
  SKILL:'var(--violet)', MCP:'var(--cyan)', AGENT:'var(--amber)', WORKFLOW:'var(--green)', TOOL:'var(--cyan)', APPROVAL:'var(--rose)',
  ERROR:'var(--red)', METRIC:'var(--muted)'};
/* Real pagination (Phase 5) against /api/store/runtimeEvents/page — see
   hydrate()'s EAGER_STORE_NAMES note for why this view no longer just
   reads a pre-loaded, silently-capped array. traceRows holds whatever
   backend pages have been fetched so far; mergedTraceRows() unions that
   with this session's own live DB.runtimeEvents buffer so an event logged
   a moment ago shows up immediately, without waiting on its own fetch. */
let traceRows = [], traceCursor = null, traceTotal = 0, traceLoading = false;
async function loadTracePage(reset){
  if (traceLoading) return; traceLoading = true;
  try {
    const qs = reset || !traceCursor ? '' : ('&before='+encodeURIComponent(traceCursor));
    const r = await fetch(apiUrl('/api/store/runtimeEvents/page?limit=120'+qs));
    if (!r.ok) return;
    const page = await r.json();
    traceRows = reset ? page.rows : traceRows.concat(page.rows);
    traceCursor = page.nextBefore; traceTotal = page.total;
  } catch(e) { /* backend unreachable this tick — keep whatever's already loaded */ }
  finally { traceLoading = false; }
}
function mergedTraceRows(){
  const byId = new Map(traceRows.map(r=>[r.id,r]));
  for (const ev of DB.runtimeEvents) byId.set(ev.id, ev);
  return [...byId.values()].sort((a,b)=>b.at.localeCompare(a.at));
}
async function renderTraceView(){
  const root = $('traceView').querySelector('.view-pad');
  root.innerHTML = `
    <div class="view-head">
      <div><span class="eyebrow">System</span><h1 class="view-title">Runtime trace</h1><p class="view-desc">An append-only log of every observable event in this workspace, durably stored in SQLite — no arbitrary retention cap. Paged from the real backend; use “Load older” to page back through full history.</p></div>
      <div style="display:flex;gap:8px">
        <input id="traceSearch" placeholder="Filter text (loaded rows)…" style="background:#ffffff08;border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:12px;color:var(--ink)" value="${escapeHtml(traceQuery)}">
        <button class="btn btn-line btn-sm" id="traceClearBtn">Clear</button>
      </div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">${TRACE_CATS.map(c=>`<button class="tag-chip trace-filter ${traceFilter.has(c)?'active-tag':''}" data-cat="${c}">${c}</button>`).join('')}</div>
    <div class="panel" style="padding:12px 14px;max-height:60vh;overflow-y:auto" id="traceLog">Loading…</div>`;
  await loadTracePage(true);
  renderTraceLog();
  bindTraceViewEvents();
}
function renderTraceLog(){
  const log = $('traceLog'); if (!log) return;
  const q = traceQuery.toLowerCase();
  const rows = mergedTraceRows().filter(e => traceFilter.has(e.category) && (!q || e.message.toLowerCase().includes(q)));
  const loadMore = traceCursor ? `<button class="btn btn-line btn-sm" id="traceLoadMoreBtn" style="margin-top:8px">Load older (${Math.max(0,traceTotal-traceRows.length)} more stored)</button>` : (traceTotal ? `<div class="empty-hint" style="margin-top:8px">All ${traceTotal} stored event(s) loaded.</div>` : '');
  log.innerHTML = (rows.length ? rows.map(e=>`<div class="trace-line"><span style="color:var(--muted-dim)">${fmtClock(e.at)}</span><span class="trace-cat" style="color:${TRACE_CAT_COLOR[e.category]||'var(--muted)'}">${e.category}</span><span>${escapeHtml(e.message)}</span></div>`).join('')
    : '<div class="empty-hint">No loaded events match this filter.</div>') + loadMore;
  const moreBtn = $('traceLoadMoreBtn');
  if (moreBtn) moreBtn.onclick = async () => { moreBtn.textContent = 'Loading…'; await loadTracePage(false); renderTraceLog(); };
}
function bindTraceViewEvents(){
  $$('.trace-filter').forEach(b=>b.onclick=()=>{
    const c = b.dataset.cat;
    if (traceFilter.has(c)) traceFilter.delete(c); else traceFilter.add(c);
    b.classList.toggle('active-tag');
    renderTraceLog();
  });
  $('traceSearch').oninput = () => { traceQuery = $('traceSearch').value; renderTraceLog(); };
  $('traceClearBtn').onclick = async () => {
    DB.runtimeEvents.length = 0;
    await idbClearStore('runtimeEvents').catch(()=>{});
    traceRows = []; traceCursor = null; traceTotal = 0;
    renderTraceLog(); toast('Trace cleared.');
  };
}

const EXEC_TYPE_ICON = {inference:'sparkles', skill:'puzzle', mcp:'plug-zap', agent:'bot', workflow:'git-branch', approval:'shield-check', error:'alert-triangle', export:'download'};
const EXEC_STATUS_BADGE = {success:'badge-green', approved:'badge-green', running:'badge-amber', pending:'badge-amber', awaiting_approval:'badge-violet', rejected:'badge-red', denied:'badge-red', error:'badge-red'};
function execStatusBadge(status){ return EXEC_STATUS_BADGE[status] || 'badge'; }
function execDurationMs(e){ return e.finishedAt ? (new Date(e.finishedAt) - new Date(e.startedAt)) : null; }
function fmtExecDuration(ms){
  if (ms === null || ms === undefined) return '—';
  if (ms < 1000) return ms + ' ms';
  if (ms < 60000) return (ms/1000).toFixed(1) + ' s';
  return Math.round(ms/60000) + ' min';
}
function resolveExecRelated(id){
  if (!id) return null;
  const sk = skillById(id); if (sk) return {kind:'Skill', name:sk.name};
  const mc = DB.mcpServers.find(x=>x.id===id); if (mc) return {kind:'MCP server', name:mc.name};
  const ag = DB.agents.find(x=>x.id===id); if (ag) return {kind:'Agent', name:ag.name};
  const wf = DB.workflows.find(x=>x.id===id); if (wf) return {kind:'Workflow', name:wf.name};
  const wr = DB.workflowRuns.find(x=>x.id===id); if (wr){ const w = DB.workflows.find(x=>x.id===wr.workflowId); return {kind:'Workflow run', name:(w?w.name:'Workflow')+' · '+wr.id}; }
  const se = sessionById(id); if (se) return {kind:'Session', name:se.title||se.id};
  return {kind:'Reference', name:id};
}

/* ===================== marker: RENDER:DIAGNOSTICS ===================== */
// Real total row count for the runtimeEvents store, read from the backend
// (Phase 5's /api/store/:name/page — its `total` field) rather than
// DB.runtimeEvents.length, which is now just this session's own live
// buffer and no longer the full picture (see hydrate()'s note). Diagnostics
// itself stays synchronous, so this is refreshed on its own cadence and the
// last known value is what the "Trace buffer" check reports.
let lastKnownEventTotal = null;
async function refreshEventTotal(){
  try {
    const r = await fetch(apiUrl('/api/store/runtimeEvents/page?limit=1'));
    if (r.ok) { const p = await r.json(); lastKnownEventTotal = p.total; }
  } catch(e) { /* backend unreachable this tick — keep last known value */ }
  // Re-render the check list in place, not the whole view shell — calling
  // renderDiagnosticsView() here would re-invoke refreshEventTotal() itself
  // (it calls this on open) and recurse forever.
  if (currentView==='diagnostics') { runDiagnostics(true); renderDiagList(); }
}
function runDiagnostics(silent){
  const checks = [];
  checks.push({name:'NOVA Runtime backend', ok: backendHealthy, detail: backendHealthy ? 'Connected — persisting to SQLite via the local API.' : 'Cannot reach the NOVA Runtime backend on this origin. Is `node server.js` running?'});
  checks.push({name:'Ollama inference engine', ok: ollamaStatus.reachable, detail: ollamaStatus.reachable ? ollamaStatus.models.length+' model(s) available at '+ollamaStatus.host+'.' : 'Not reachable at '+(ollamaStatus.host||'—')+'. Generation will fall back to the simulated reply path. Run `ollama serve`.'});
  checks.push({name:'Model loaded', ok: !!loadedModel(), detail: loadedModel() ? loadedModel().name+' ('+loadedModel().runtime+')' : 'No model is currently loaded.'});
  checks.push({name:'Knowledge index', ok: DB.knowledgeCollections.every(c=>c.status!=='pending'), detail: DB.knowledgeCollections.filter(c=>c.status==='stale').length+' stale, '+DB.knowledgeCollections.filter(c=>c.status==='pending').length+' pending collection(s).'});
  checks.push({name:'Privacy boundary', ok: computePrivacyState().level!=='REMOTE MODEL', detail: computePrivacyState().level});
  checks.push({name:'Automation health', ok: DB.automationRuns.length===0 || !DB.automationRuns.slice(-3).every(r=>r.status==='Failed'), detail: DB.automationRuns.filter(r=>r.status==='Failed').length+' failed run(s) in history.'});
  // Real liveness for the backend's own scheduler tick (SCHED comes from
  // GET /api/scheduler/status, not a client-side guess) — ok when it's
  // reported itself running and ticked within the last two tick intervals.
  const tickAgeMs = SCHED.lastTickAt ? (Date.now()-new Date(SCHED.lastTickAt).getTime()) : null;
  const tickStale = SCHED.tickMs ? tickAgeMs!=null && tickAgeMs > SCHED.tickMs*2 : false;
  checks.push({name:'Scheduler', ok: SCHED.running && !tickStale, detail: !SCHED.running ? 'Backend has not reported scheduler status yet.'
    : (SCHED.enabledScheduleCount+' enabled schedule automation(s)'+(SCHED.nextDueAt?' · next due '+fmtRelDate(SCHED.nextDueAt):'')+(tickAgeMs!=null?' · last tick '+(tickAgeMs/1000).toFixed(0)+'s ago':' · no tick yet')+(SCHED.lastCatchUp?' · rescheduled '+SCHED.lastCatchUp.rescheduled+' overdue automation(s) at startup':''))});
  // Real liveness: TELE.sampledAt is set by stepTelemetry() only on an
  // actual successful /api/telemetry round trip, not just "the loop is
  // scheduled" — so this reflects the loop genuinely still ticking.
  const teleAgeMs = TELE.sampledAt ? (Date.now()-TELE.sampledAt) : null;
  checks.push({name:'Telemetry loop', ok: teleAgeMs!=null && teleAgeMs < 5000, detail: teleAgeMs!=null ? ('Last real sample '+(teleAgeMs/1000).toFixed(1)+'s ago.') : 'No successful sample yet.'});
  checks.push({name:'Trace buffer', ok: true, detail: lastKnownEventTotal!=null ? (lastKnownEventTotal+' event(s) durably stored in SQLite — no arbitrary retention cap.') : 'Event count not yet loaded from backend.'});
  diagnosticsResults = checks;
  const failCount = checks.filter(c=>!c.ok).length;
  const dot = $('railRuntimeDot'); if (dot) dot.style.background = failCount ? 'var(--red)' : 'var(--green)';
  if (!silent) logEvent('SESSION','diagnostics run · '+(checks.length-failCount)+'/'+checks.length+' passing');
  // Repaint just the list, not the whole view shell — renderDiagnosticsView()
  // itself calls runDiagnostics(true), so calling that here would recurse.
  if (currentView==='diagnostics') renderDiagList();
  return checks;
}
function renderDiagnosticsView(){
  const root = $('diagnosticsView').querySelector('.view-pad');
  root.innerHTML = `
    <div class="view-head">
      <div><span class="eyebrow">System</span><h1 class="view-title">Diagnostics</h1><p class="view-desc">Self-check across persistence, the active model, the knowledge index, automations, and the privacy boundary.</p></div>
      <button class="btn btn-amber" id="diagRunBtn"><span data-lucide="stethoscope" style="width:13px;height:13px"></span>Run diagnostics</button>
    </div>
    <div class="panel" style="padding:6px 16px" id="diagList"></div>`;
  // Recompute fresh every time the view opens — TELE.sampledAt/
  // lastKnownEventTotal (and ollamaStatus, backendHealthy, ...) keep
  // updating in the background on their own polling loops regardless of
  // which view is open, so a diagnosticsResults snapshot taken once at
  // app boot would otherwise go stale the moment you actually look at it.
  runDiagnostics(true);
  renderDiagList();
  refreshEventTotal(); // opportunistically pull a current total too, in case the 15s interval hasn't ticked yet
  refreshSchedulerStatus();
  if (window.lucide) lucide.createIcons();
  $('diagRunBtn').onclick = () => { runDiagnostics(false); renderDiagList(); toast('Diagnostics complete.'); };
}
function renderDiagList(){
  const list = $('diagList'); if (!list) return;
  const checks = diagnosticsResults.length ? diagnosticsResults : runDiagnostics(true);
  list.innerHTML = checks.map(c=>`<div class="diag-item"><span style="display:flex;align-items:center;gap:8px"><span class="priv-dot" style="background:${c.ok?'var(--green)':'var(--red)'}"></span>${escapeHtml(c.name)}</span><span class="mono" style="color:var(--muted-dim);font-size:11.5px;text-align:right">${escapeHtml(c.detail)}</span></div>`).join('');
}

          <div><div style="font-size:12.5px">Allow network access</div><div style="font-size:11px;color:var(--muted-dim);margin-top:2px">Needed for remote models and web-connected automations.</div></div>
          <button class="toggle ${p.webAccess?'on':''}" id="setWebAccess"></button>

        <div style="margin-top:12px"><span class="badge ${priv.cls==='state-good'?'badge-green':priv.cls==='state-info'?'badge-blue':'badge-red'}">${priv.level}</span>
          <div style="font-size:11.5px;color:var(--muted);margin-top:8px">${priv.level==='LOCAL ONLY' ? 'No network access is enabled and the loaded model runs locally — nothing leaves this workspace.' : priv.level==='NETWORK ALLOWED' ? 'Network access is enabled. The loaded model still runs locally, but automations and collectors may reach the network.' : 'The loaded model is a remote/hosted model — prompts and retrieved context for this session leave the workspace.'}</div>

    <div class="panel" style="padding:16px;margin-top:16px">
      <div class="eyebrow" style="margin-bottom:12px">Workspace data</div>
      <div class="kv tnum"><span>Sessions</span><span>${DB.sessions.length}</span><span>Models in registry</span><span>${DB.models.length}</span><span>Knowledge documents</span><span>${DB.knowledgeDocuments.length}</span><span>Automations</span><span>${DB.automations.length}</span></div>
      <button class="btn btn-danger btn-sm" id="resetWorkspaceBtn" style="margin-top:14px">Reset workspace data</button>

  bindSettingsViewEvents();

function bindSettingsViewEvents(){
  const bind = (id, key) => { const el = $(id); el.onclick = () => { const val = !getPrefs()[key]; setPrefs({[key]:val}); el.classList.toggle('on', val); renderShellChrome(); }; };
  bind('setRetrieval','retrieval'); bind('setCitations','citations'); bind('setStreaming','streaming'); bind('setWebAccess','webAccess'); bind('setTelemetry','telemetry');
  $('setTheme').onchange = e => { setPrefs({theme:e.target.value}); applyAppearance(); renderShellChrome(); toast('Theme updated.'); };
  $('setLanguage').onchange = e => { setPrefs({language:e.target.value}); applyAppearance(); renderSettingsView(); toast('Language updated.'); };

}

let cmdkFiltered = COMMANDS;
function openCmdk(){ $('cmdkModal').classList.add('open'); $('cmdkInput').value=''; cmdkFiltered = COMMANDS; cmdkIndex = 0; renderCmdkList(); $('cmdkInput').focus(); }
function closeCmdk(){ $('cmdkModal').classList.remove('open'); }
function renderCmdkList(){
  $('cmdkList').innerHTML = cmdkFiltered.map((c,i)=>`<button class="cmdk-item ${i===cmdkIndex?'active':''}" data-i="${i}" style="width:100%;padding:9px 10px;display:flex;gap:10px;align-items:center;border-radius:7px"><span data-lucide="${c.icon}" style="width:14px;height:14px;opacity:.8"></span>${escapeHtml(c.label)}</button>`).join('') || '<div class="empty-hint">No matching command.</div>';
  if (window.lucide) lucide.createIcons();
  $$('.cmdk-item').forEach(b=>b.onclick=()=>{ const cmd = cmdkFiltered[+b.dataset.i]; if (cmd){ cmd.run(); closeCmdk(); } });
}
function bindCmdk(){
  $('cmdkBtn').onclick = openCmdk;
  $('cmdkModal').addEventListener('click', e => { if (e.target.id==='cmdkModal') closeCmdk(); });
  $('cmdkInput').addEventListener('input', () => {
    const q = $('cmdkInput').value.toLowerCase();
    cmdkFiltered = COMMANDS.filter(c=>c.label.toLowerCase().includes(q));
    cmdkIndex = 0; renderCmdkList();
  });
  $('cmdkInput').addEventListener('keydown', e => {
    if (e.key==='ArrowDown'){ e.preventDefault(); cmdkIndex = Math.min(cmdkIndex+1, cmdkFiltered.length-1); renderCmdkList(); }
    else if (e.key==='ArrowUp'){ e.preventDefault(); cmdkIndex = Math.max(cmdkIndex-1, 0); renderCmdkList(); }
    else if (e.key==='Enter'){ e.preventDefault(); const cmd = cmdkFiltered[cmdkIndex]; if (cmd){ cmd.run(); closeCmdk(); } }
    else if (e.key==='Escape'){ closeCmdk(); }
  });
}
function openModelPicker(){ renderModelPickerList(); $('modelPickerModal').classList.add('open'); }
function closeModelPicker(){ $('modelPickerModal').classList.remove('open'); }
function renderModelPickerList(){
  $('modelPickerList').innerHTML = DB.models.map(m=>`<button class="rail-btn model-pick-item" data-id="${m.id}" style="width:100%;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-radius:8px">

  if (window.lucide) lucide.createIcons();

    const s = activeSession(); if (s){ s.modelId = m.id; idbPut('sessions', s); renderConvo(); }
    renderShellChrome(); closeModelPicker();
    logEvent('MODEL', m.name+' set active'+(s?' for session '+s.id:'')); toast(m.name+' is now active.');
  });
}
function cycleInferenceProfile(){
  const s = activeSession(); if (!s) return;
  const names = ['Balanced', ...DB.modelProfiles.map(p=>p.name)];
  const idx = (names.indexOf($('profileBtn').textContent) + 1) % names.length;
  const next = names[idx];
  $('profileBtn').textContent = next;
  if (next === 'Balanced') { Object.assign(s.preferences, {temperature:0.7, topP:0.9, topK:40, repeatPenalty:1.1}); }
  else { const p = DB.modelProfiles.find(x=>x.name===next); if (p) Object.assign(s.preferences, {temperature:p.temperature, topP:p.topP, topK:p.topK, repeatPenalty:p.repeatPenalty}); }
  idbPut('sessions', s); renderInspBody(); toast('Profile: '+next);
}
function toggleRetrievalForSession(){
  const s = activeSession(); if (!s) return;
  s.preferences.retrieval = !s.preferences.retrieval; idbPut('sessions', s);
  renderComposerChrome(); renderInspBody();
}
function simulateAttachFile(){
  const s = activeSession(); if (!s) return toast('Open a session first.');
  s._contextFiles = s._contextFiles || [];
  s._contextFiles.push(pick(['notes.md','spec-draft.txt','benchmark.csv','diagram.png']));
  renderComposerChrome(); renderInspBody();
  logEvent('FILE', 'attached '+s._contextFiles[s._contextFiles.length-1]+' to session '+s.id);
}
function bindGlobalUI(){

}
